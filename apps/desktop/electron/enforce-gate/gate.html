<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'" />
  <title>Tomfish</title>
  <style>
    :root { color-scheme: light; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #f7f9fc 0%, #eef2f8 100%);
      color: #1f2733;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-user-select: none;
      user-select: none;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(31, 39, 51, 0.12);
      padding: 32px 28px;
      text-align: center;
    }
    .icon { font-size: 44px; margin-bottom: 14px; }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 10px; }
    .body { font-size: 13px; line-height: 1.7; color: #5a6472; margin-bottom: 14px; }
    .version { font-size: 12.5px; color: #8a93a3; margin-bottom: 20px; }
    .version b { color: #1f2733; font-weight: 600; }
    .progress-wrap { margin: 0 0 16px; display: none; }
    .progress-bar { height: 6px; background: #e6eaf1; border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: #3562e3; border-radius: 3px; transition: width .3s; }
    .progress-text { font-size: 12px; color: #5a6472; margin-top: 8px; }
    .btn {
      width: 100%;
      padding: 11px 0;
      border: none;
      border-radius: 8px;
      background: #3562e3;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:disabled { background: #9db4ee; cursor: not-allowed; }
    .btn.secondary { background: #eef1f7; color: #3562e3; margin-top: 10px; }
    .error { display: none; color: #d4380d; font-size: 12.5px; margin-bottom: 12px; line-height: 1.6; }
    .drag-region { position: fixed; top: 0; left: 0; right: 0; height: 32px; -webkit-app-region: no-drag; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🛡️</div>
    <h1 id="title"></h1>
    <p class="body" id="body"></p>
    <p class="version" id="version" style="display:none"></p>
    <div class="error" id="error"></div>
    <div class="progress-wrap" id="progress">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText"></div>
    </div>
    <button class="btn" id="actionBtn"></button>
    <button class="btn secondary" id="retryBtn" style="display:none"></button>
  </div>
  <script src="./gate.js"></script>
</body>
</html>
