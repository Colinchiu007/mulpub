# OpsCenter — 运营配置中心
#
# P1-15 安全响应头（CSP / nosniff / no-referrer / X-Frame-Options）。
# 三层下发、缺一即漏：
#   1) 本文件 —— 覆盖 **nginx 直接返回的静态资源**（index.html / js / css）；
#   2) 后端 FastAPI 中间件（main.py security_headers）—— 覆盖所有 API 响应，
#      可用 OPS_CONTENT_SECURITY_POLICY 覆盖，置空即不下发（交给本层）；
#   3) vite dev 插件（frontend/vite.config.js）—— 只作用于本地开发，不进产物。
# 注意：
#   - `frame-ancestors` 只能通过 HTTP 头生效（<meta> 通道不支持），所以嵌框防护必须留在这里；
#   - nginx 的继承规则是「下级出现了自己的 add_header 就完全不再继承上级」，
#     因此不要在下面的 location 里再单独写 add_header，除非把整组头复制过去；
#   - 反向代理终结 TLS 时后端只看到 http：必须保留 X-Forwarded-Proto，
#     并显式设 OPS_SESSION_COOKIE_SECURE=1，否则浏览器既不存也不回传会话 Cookie。
#   - 会话 Cookie 为 HttpOnly + SameSite=Lax，前后端必须同源部署（本文件即同 host 转发）。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;

# OpsCenter 后端（页面与 API 同源）
location /ops/ {
    proxy_pass http://127.0.0.1:8010/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# OpsCenter API (if accessed via /api/ops/ prefix)
location /api/ops/ {
    proxy_pass http://127.0.0.1:8010/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 若 SPA 静态产物由本机 nginx 直接托管（deploy.sh 已把 frontend/dist 同步到
# /var/www/ops-center），取消下面注释；务必与 API 保持同一 host，
# 否则 SameSite=Lax 的会话 Cookie 不会随请求携带，表现为「登录成功但刷新又回登录页」。
