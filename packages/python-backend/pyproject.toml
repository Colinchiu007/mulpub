[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-publish-backend"
version = "1.0.0"
description = "Multi-Publish Python Backend (FastAPI + RPA)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "playwright>=1.50.0",
]

[project.optional-dependencies]
aggregation = [
    "content-aggregator>=0.1.0",
    "content-aggregator-shared>=0.1.0",
]
# 博主监控多平台签名（PRD-CREATOR-MULTI-PLATFORM-2026-10-12 §2/§3）：
# xhshow（MIT，Cloxl/xhshow）= 小红书 x-s / x-s-common 纯算法签名；
# 抖音 a_bogus 由本仓 self-contained 实现提供（Apache-2.0 算法移植，见
# multi_publish/creator_sign/abogus.py），不引第三方以免依赖面扩散。
creator-sign = [
    "xhshow>=0.2.0",
]
web = [
    "jinja2>=3.1",
    "pyyaml>=6.0",
]
video = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
]
asr = [
    "faster-whisper>=1.0.0",
]
test = [
    # 发布器回归测试此前只靠 CI 里临时 `pip install`，仓库内无声明：本地环境缺
    # pytest-asyncio 时 @pytest.mark.asyncio 用例会「0 收集 / 静默跳过」而不是报错，
    # 门禁看着是绿的其实是空的。声明进 extra 后装 [..,test] 即得同一套依赖。
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
all = [
    "multi-publish-backend[web,video,asr,creator-sign]",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["multi_publish*", "wechat_publisher*"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["multi_publish", "wechat_publisher"]
