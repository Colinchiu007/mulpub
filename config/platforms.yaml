# 多平台发布 — 平台配置
# 参考融媒宝 data/media_url_list.txt 设计
# 新增平台只需在这里加一段配置
#
# 字段说明:
#   type              — 旧字段（article/mixed），保留兼容
#   category          — 语言分类（中文/海外）
#   content_category  — 内容类型分类（VIDEO/IMAGE_TEXT/MIXED），对应 PRD F9 PlatformCategory

platforms:
