# 多平台发布 — 平台配置
# 参考融媒宝 data/media_url_list.txt 设计
# 新增平台只需在这里加一段配置
#
# 字段说明:
#   type              — 旧字段（article/mixed），保留兼容
#   category          — 语言分类（中文/海外）
#   content_category  — 内容类型分类（VIDEO/IMAGE_TEXT/MIXED），对应 PRD F9 PlatformCategory

platforms:
  wechat_mp:
    id: 1
    name: 微信公众号
    type: article
    icon: 💬
    category: 中文
    content_category: IMAGE_TEXT
    publish_url: ''
    data_url: https://mp.weixin.qq.com/cgi-bin/message
    comment_url: https://mp.weixin.qq.com/misc/appmsgcomment
    cover_size: 900x500
    max_title: 64
    max_content: 20000
    has_api: false
    publishMode: dom-only   # W1 §5.1 三态总闸：api-only|api-then-dom|dom-only
    enabled: true
  zhihu:
    id: 12
    name: 知乎
    type: article
    icon: ❓
    category: 中文
    content_category: IMAGE_TEXT
    publish_url: https://zhuanlan.zhihu.com/write
    data_url: ''
    comment_url: ''
    cover_size: 1280x720
    max_title: 50
    # 阈值来源：以 publish-capabilities.json 为准（contentMax=100000）。本文件该值曾为 5000，
    # 与注册表漂移（2026-10-01 复查对账修正）。知乎为长文平台，未做平台侧实测取证。
    max_content: 100000
    has_api: false
    publishMode: dom-only   # W1 §5.1 三态总闸：api-only|api-then-dom|dom-only
    enabled: true
  weibo:
    has_api: false
    publishMode: dom-only   # W1 §5.1 三态总闸：api-only|api-then-dom|dom-only
    name: 微博
    type: mixed
    icon: 🔥
    category: 中文
    content_category: MIXED
    max_title: 140
    # 阈值来源：官方 FAQ 佐证（下述链接）；2026-10-02 用户终裁放宽至 10000。原注释：微博客服中心官方 FAQ（kefu.weibo.com/faqdetail?id=21510，2024-09-04 更新）
    # 原文「最多可以发布5000汉字」（high 置信）。本文件该值历史在 2000/5000 间摆动：
    # 2026-10-01 复查曾按注册表回改成 2000，2026-10-02 平台调研（官方 FAQ 佐证）终裁 5000（2026-10-02 用户确认放宽至 10000），
    # 并同步注册表/引擎表（见 01-docs/PLATFORM-CHAR-LIMITS-RESEARCH-2026-10-02.md）。
    max_content: 10000
    enabled: true
  douyin:
    # 2026-10-06 修正：此前 has_api=false 与同文件 publishMode=api-then-dom 自相矛盾——
    # api-then-dom 本身就要求存在 API 轨，而 has_api 正是桌面端 RpaViewManager 唯一的
    # API 闸门（rpa-view-manager.js shouldUseApi 读的就是本字段），于是抖音的完整发布链
    # （src/publish/platforms/douyin-video.js + douyin-image.js，带完整链级测试）
    # 实际从未被触发，等同死代码。
    # 改 true 后语义仍是 api-then-dom：API 失败照样回退 DOM 轨，不改变失败路径。
    has_api: true
    publishMode: api-then-dom   # W1 §5.1 三态总闸：api-only|api-then-dom|dom-only
    name: 抖音
    type: mixed
    icon: 🎵
    category: 中文
    content_category: VIDEO
    max_title: 55
    max_content: 5000
    enabled: true
  xiaohongshu:
    id: 51
    name: 小红书
    type: mixed
    icon: 📕
    category: 中文
    content_category: IMAGE_TEXT
    publish_url: https://creator.xiaohongshu.com/
    data_url: https://creator.xiaohongshu.com/creator/data-center
    comment_url: https://creator.xiaohongshu.com/creator/comment
    cover_size: 1080x1080
    max_title: 20
    max_content: 5000
    has_api: false
    publishMode: dom-only   # W1 §5.1 三态总闸：api-only|api-then-dom|dom-only
    enabled: true
  # ⚠️ 命名澄清（publish-frequency-policy-v2 P2-3）：本条的 id 是 `tencent_video`，
  # 但 name 是「视频号」、publish_url 指向 channels.weixin.qq.com —— 实际发布目标是
  # **微信视频号**（WeChat Channels），不是腾讯视频（v.qq.com，其开放平台已关闭）。
  # id 因存量数据/账号绑定/历史记录兼容无法改名，**新增代码请勿据 id 推断平台归属**。
  # 频率策略表里 `tencent_video` 同样指视频号；腾讯视频（v.qq.com）未接入。
  tencent_video:
    id: 21
    name: 视频号
    type: mixed
    icon: ▶
    category: 中文
    content_category: VIDEO
    publish_url: https://channels.weixin.qq.com/
    data_url: ''
    comment_url: ''
    cover_size: 1080x1080
    max_title: 60
    max_content: 5000
    # 2026-10-06 修正：同 douyin —— has_api=false 与同文件 publishMode=api-then-dom
    # 自相矛盾，使视频号完整链（src/publish/platforms/shipinhao-video.js，
    # 分片 + Content-MD5 + post_draft/post_create 双分支，带链级测试）从未被触发。
    has_api: true
    publishMode: api-then-dom   # W1 §5.1 三态总闸：api-only|api-then-dom|dom-only
    enabled: true
  kuaishou:
    id: 35
    name: 快手
    type: mixed
    icon: 🎬
    category: 中文
    content_category: VIDEO
    publish_url: https://cp.kuaishou.com/article/publish/video?tabType=1
    data_url: ''
    comment_url: ''
    cover_size: 1080x1440
    max_title: 55
    # 2026-09 live DOM 取证（01-docs/evidence/rpa-dom-2026-09-23/d4-1-kuaishou.json）：快手编辑页
    # 没有独立标题输入框，作品标题与描述共用 div#work-description-edit[contenteditable]
    # （placeholder=“作品描述不会写？试试智能文案”）；RPA 因此把标题+正文合并写进
    # 该编辑器（rpa-view-platforms._composeEditorCaption），长度上限即 max_content。
    # 2026-09-30 修正：快手图文发布页实测计数器为 **x/500**（截图取证：921 字时表单
    # 红字「作品描述超过字数限制」并阻断提交）。旧值 1000 会让合并文案（标题+正文）
    # 远超平台上限而被静默拒绝，故对齐实况。
    # 取 480 而非 500：实测截断到 500 时平台计数器显示 **505/500**（平台计数与
    # 本仓按码点截断存在偏差，含换行/标题拼接等），留 20 字安全边距确保不越界。
    max_content: 480
    has_api: true
    publishMode: api-then-dom   # W3 §5.4 快手 API 发布链入波（签名页未就绪/不支持时可降级 DOM）
    enabled: true
