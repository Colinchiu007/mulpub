    comment_url: https://mp.weixin.qq.com/misc/appmsgcomment
    cover_size: 900x500
    max_title: 64
    max_content: 20000
    has_api: false
    publishMode: dom-only   # W1 §5.1 三态总闸：api-only|api-then-dom|dom-only
    enabled: true
