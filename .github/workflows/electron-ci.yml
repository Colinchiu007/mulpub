# Electron CI — Windows 自托管 runner 确定性回归（windows-latest）
# 职责边界（2026-08-09 迁移 A/B/C）：
# 1. 本 job 现运行于 Windows 自托管 runner（windows-latest）：依赖 GitHub 托管 windows-latest（公开仓无限免费额度）；原先常
#    queued 30-40 分钟）与生产隔离问题（ECS 同时承载 Logto + 业务 API，20 分钟全量测试抢资源）。
# 2. 本 job = Electron headless 冒烟 + Electron checksum pin 校验 + deps/circular 检查；
#    Electron GUI 深度门禁由 gui-test.yml（同 windows-latest）承担。
#    2026-09-17 CI 提速：桌面 vitest 步已收敛为「仅 main push / workflow_dispatch」执行，
#    PR 上由 Quality Gate 的 desktop-shards 承担 —— 避免同一批桌面测试在单次 PR 中重复执行。
# 3. Windows 无需虚拟显示器（Electron headless 直接运行）；better-sqlite3 不在依赖图（sqlite-wrapper.js 为 sql.js 兼容层），无需 @electron/rebuild。
# 4. ECS 自托管 runner 保留配置但不再必需；如需移除，见仓库 Settings → Actions → Runners。
name: Electron CI

on:
  push:
    branches: [main]
    paths-ignore:
      # 文档/流程改动不触发 CI（清单与 .github/scripts/workflow-contract.test.js 的 CI_IGNORED_PATHS 保持同步）
      - '01-docs/**'
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
      - '.ccg/**'
      - '.claude/**'
      - '.agents/**'
      - '.quality-rhythm/**'
      - 'openspec/**'
      - '.adversarial/**'
      - 'scripts/gate-record-debt-ledger.json'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # push（main）按 run_id 唯一分组：GitHub 在同一并发组里只允许一个排队者，
  # 新 push 一到就把还在排队的旧 push 置为 cancelled，而那条 sha 此后再没有 run ⇒ 主侧证据永久丢失。
  # 实测（近 1000 条 main push run 按 (sha, workflow) 归集）：被取消过又有后续 run 补回的 = 0 格。
  # 由 .github/scripts/workflow-contract.test.js 的「2b) main push 的并发组」锁住，详见 #2642。
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --- docs-only 短路判定（change: docs-only-ci-shortcircuit；与 quality-gate.yml 同模式）---
  # 红线不变：pull_request 触发级 paths-ignore 仍被 workflow-contract.test.js 禁止（PR #2151 死锁）。
  # PR 上本 workflow 剩余开销是 install + Electron 下载 + 冒烟 + build Vue + deps/circular
  # （桌面 vitest 已收敛为仅 main push），对纯文档 PR 全部无意义 => job 级短路。
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # merge-base diff 需要完整历史

      - name: Detect docs-only changes
        id: classify
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            echo "docs-only=false (non-PR event: full run)"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          node scripts/classify-docs-only.js --base="$BASE" --repo="$PWD"

  # --- 桌面单测的**分片**执行（change: electron-ci-shard-landing） ---------------------------
  # 为什么把整轮拆开：整轮（--maxWorkers=1 --no-file-parallelism 确定性串行）的步骤级实测
  # 2026-10-21 是 1678s / 1759s 两次成功、两次直接撞 2100s 的墙（rc=124，零断言失败）——
  # 即"健康耗时"已经贴着墙，余量只剩 19%~25%，runner 稍慢一点就整轮跑不完。
  # 墙抬高只是把不可归因的超时往后推（docs/electron-ci-step-budget-baseline.md 记着这条禁令），
  # 根因修法是把这一轮按 --shard 切开：每片工作量降到 1/N，单片墙也随之变小。
  #
  # ⚠️ 作业 id 必须是 `electron-tests-shards`（**不是** `electron-tests`）：
  #    matrix 作业的 check 名恒带后缀（`electron-tests-shards (1)`），
  #    而 ruleset `main-ci-gate`（id 23749994）要求的 required context 里**有** `electron-tests`
  #    ⇒ 那个 context 只能由下面那个**非 matrix、id 与 name 都叫 `electron-tests`** 的汇入作业报出来。
  #    2026-10-20 三轮实测（见 openspec/records/electron-ci-shard.md §九）：给 matrix 作业起名
  #    `electron-tests` 也没用，check 名仍是 `electron-tests (1)`。
  electron-tests-shards:
    name: Unit tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: windows-latest
    needs: [changes]
    # ① docs-only 短路：纯文档 PR 跳过（skipped 满足 required check；混合 PR 全量不变）
    # ② 只在非 PR 事件跑：PR 上同一批桌面测试已由 QG desktop-shards 分片执行（2026-09-17 起），
    #    这里再跑一遍就是纯浪费——而且是 4 份 setup（install/electron runtime/preload 构建）。
    #    条件必须写成**字面量**（workflow-contract.test.js 钉住"不得缺省"：缺省=两种事件都跑）。
    if: needs.changes.outputs.docs-only != 'true' && github.event_name != 'pull_request'
    strategy:
      # 任一片失败都让其余片跑完：cancel 掉其余片就拿不到"哪几片红"，诊断成本反而更高
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # 预算不得倒挂：install 10 + electron runtime 10 + 单片墙 1100s(18.3min) + 其余步骤余量
    # ⇒ 显式上限之和 28.3min 必须小于本值（锁：apps/desktop/tests/gui-ci-exit-contract.test.js）
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      NODE_ENV: test
      SKIP_NATIVE_MEDIA_TOOL_TESTS: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Restore required JavaScript runtimes
        run: |
          node scripts/run-package-install.js esbuild
          node scripts/run-package-install.js --script scripts/postinstall.js vue-demi

      - name: Verify Electron checksum pin (win32, windows-latest)
        run: |
          node -e "const checksums = require('./node_modules/electron/checksums.json'); const artifact = 'electron-v43.7.7-win32-x64.zip'; const pinned = checksums[artifact]; if (typeof pinned !== 'string' || pinned.length === 0) throw new Error('Electron checksum pin missing for ' + artifact); console.log('Electron ' + artifact + ' checksum verified present in manifest');"

      - name: Install Electron runtime
        timeout-minutes: 10
        env:
          ELECTRON_MIRROR: https://cdn.npmmirror.com/binaries/electron/
        run: |
          unset electron_use_remote_checksums npm_config_electron_use_remote_checksums
          node node_modules/electron/install.js

      # 这 5 个受管构建产物已于 #3782 移出版本控制（.gitignore 吞掉），于是"干净检出里没有它们"。
      # 下面那步桌面全量测试里有 9 个文件是**拿真实产物对账**的（preload-path / ipc-contract /
      # build-preload / viral-pr2-preload / preload-variant / overlay-view-suspension / shell-mode-6b /
      # podcast-plan-preview-ipc / podcast-script-ipc），缺这两步就 ENOENT 红。
      # `if` 与被配对的测试步**逐字相同**：不跑测试时也不白跑构建。
      - name: Build preload bundles
        if: github.event_name != 'pull_request'
        run: |
          pnpm --filter @multi-publish/desktop run build:preload
          pnpm --filter @multi-publish/desktop run build:paginator

      # 单片预算：按**当前整轮实测**摊薄后再留负载余量。
      #   整轮实测 1678s~1759s（2026-10-21 main push 两次成功运行的 `elapsed=` 自证行）
      #   ÷ 4 片 ⇒ 单片健康 ≈ 440s；同样负载下的整轮最坏 ≥2100s ⇒ 单片最坏 ≈ 525s
      #   1100s ⇒ 对单片健康 2.5×、对单片最坏 2.1× 余量
      # 且 1100s **低于**它取代的现行整轮预算 2100s（不是抬预算的包装）、低于原始魔数 1200s、
      # 低于整轮实测 1759s。三个数各自的身份见 docs/electron-ci-step-budget-baseline.md。
      # ⚠️ 改预算必须先补一次**步骤级实测**（读 `elapsed=` 行），再改锁里的常量。
      - name: Unit tests (Vitest, non-Electron, single-worker deterministic)
        if: github.event_name != 'pull_request'
        run: |
          BUDGET_SECONDS=1100
          LOG=electron-ci-unit-tests-shard-${{ matrix.shard }}.log
          START=$(date +%s)
          # ⛔ `set +e` 是必须的，不是风格（2026-10-20 follow-up，动因见 #2525 的反面）：
          #    本 job 的 shell 是 `bash -e -o pipefail`，`timeout` 返回 124 时 `-e` 会**立刻
          #    退出步骤**，于是后面的 PIPESTATUS 与整段自证诊断一次都不会执行。
          set +e
          timeout --signal=TERM --kill-after=30s ${BUDGET_SECONDS}s \
            pnpm --filter @multi-publish/desktop test -- \
            --shard=${{ matrix.shard }}/${{ strategy.job-total }} \
            --maxWorkers=1 --no-file-parallelism --reporter=verbose \
            --testTimeout=10000 --hookTimeout=10000 --teardownTimeout=10000 2>&1 | tee "$LOG"
          # 必须读 PIPESTATUS：`cmd | tee` 的 $? 是 tee 的退出码（恒 0），
          # 直接判 $? 会把超时和断言失败一起吞成成功。
          RC=${PIPESTATUS[0]}
          set -e
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "[electron-ci-timeout-budget] elapsed=${ELAPSED}s budget=${BUDGET_SECONDS}s rc=${RC} shard=${{ matrix.shard }}/${{ strategy.job-total }}"
          if [ "${RC}" -eq 124 ]; then
            echo "TIMEOUT_BUDGET_EXCEEDED：单片被步骤级 timeout 掐断，不是断言失败。"
            echo "自证判据：日志里没有 vitest 摘要行（Test Files ... / Tests ...），说明整片没跑完。"
            grep -cE '^[[:space:]]+[✓×↓-]' "$LOG" | sed 's/^/已完成测试行数: /' || true
            grep -cE '^ *(Test Files|Tests) ' "$LOG" | sed 's/^/摘要行数(应为 2): /' || true
            tail -n 8 "$LOG" | sed 's/^/末段输出: /' || true
            echo "下一步应该是把分片数调大，而不是继续加大预算。"
          fi
          exit "${RC}"

      - name: Vitest failure diagnostics
        if: failure()
        run: |
          echo "Vitest 或前置步骤失败，输出 runner 进程列表"
          tasklist.exe 2>/dev/null | head -40 || true

  # --- 汇入作业：把分片结果按 required context `electron-tests` 报出去 -----------------------
  # 必须是**非 matrix**、**id 与 name 都叫 `electron-tests`** 的作业（ruleset main-ci-gate 要求的
  # context 就是这个名字；matrix 作业的 check 名恒带后缀，报不出这个名字）。
  # 本作业同时承担「冒烟 + Vue 构建 + 依赖/环依赖检查」——这些步骤与单测无关，不该进分片。
  electron-tests:
    name: electron-tests
    runs-on: windows-latest
    needs: [changes, electron-tests-shards]
    # always()：分片作业被跳过（docs-only 短路）或失败时，本作业仍要出现，
    # 否则 required context 那一格**不出现**＝另一种"Expected — waiting for status to be reported"。
    if: always() && needs.changes.outputs.docs-only != 'true'
    # 预算不得倒挂：本作业已不含单测轮（它搬去分片作业了），
    # 显式上限只剩 install 10 + electron runtime 10 + 其余步骤（冒烟 30s / Vue 构建 / 依赖检查），
    # 35 留得住。旧值 70 是因为整轮单测（内层 35min）曾在本作业内。
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      NODE_ENV: test
      SKIP_NATIVE_MEDIA_TOOL_TESTS: '1'

    steps:
      # 汇入判定：任一片失败 ⇒ 本作业失败（否则 required context 恒绿，分片红了也没人知道）
      - name: Fail when a unit test shard failed
        if: needs.electron-tests-shards.result == 'failure' || needs.electron-tests-shards.result == 'cancelled'
        run: |
          echo "unit test shards result: ${{ needs.electron-tests-shards.result }}"
          exit 1

      - name: Report unit test shard result
        run: |
          echo "unit test shards result: ${{ needs.electron-tests-shards.result }}"

      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Restore required JavaScript runtimes
        run: |
          node scripts/run-package-install.js esbuild
          node scripts/run-package-install.js --script scripts/postinstall.js vue-demi

      - name: Verify Electron checksum pin (win32, windows-latest)
        run: |
          node -e "const checksums = require('./node_modules/electron/checksums.json'); const artifact = 'electron-v43.7.7-win32-x64.zip'; const pinned = checksums[artifact]; if (typeof pinned !== 'string' || pinned.length === 0) throw new Error('Electron checksum pin missing for ' + artifact); console.log('Electron ' + artifact + ' checksum verified present in manifest');"

      - name: Install Electron runtime
        timeout-minutes: 10
        env:
          ELECTRON_MIRROR: https://cdn.npmmirror.com/binaries/electron/
        run: |
          unset electron_use_remote_checksums npm_config_electron_use_remote_checksums
          node node_modules/electron/install.js

      # 这 5 个受管构建产物已于 #3782 移出版本控制（.gitignore 吞掉），于是"干净检出里没有它们"。
      # 下面那步桌面全量测试里有 9 个文件是**拿真实产物对账**的（preload-path / ipc-contract /
      # build-preload / viral-pr2-preload / preload-variant / overlay-view-suspension / shell-mode-6b /
      # podcast-plan-preview-ipc / podcast-script-ipc），缺这两步就 ENOENT 红。
      # `if` 与被配对的测试步**逐字相同**：不跑测试时也不白跑构建。
      - name: Build preload bundles
        if: github.event_name != 'pull_request'
        run: |
          pnpm --filter @multi-publish/desktop run build:preload
          pnpm --filter @multi-publish/desktop run build:paginator

      - name: Electron smoke test (headless, windows-latest)
        run: |
          cd apps/desktop
          set +e
          timeout 30 pnpm exec electron . --no-sandbox --disable-gpu 2>&1
          status=$?
          set -e
          if [ "$status" -eq 124 ]; then
            echo "Electron remained alive for the smoke window"
          elif [ "$status" -eq 0 ]; then
            echo "Electron exited before the smoke window completed"
            exit 1
          else
            exit "$status"
          fi

      - name: Build Vue frontend
        run: |
          pnpm --filter @multi-publish/desktop build:vue

      - name: Dependency check
        run: pnpm run check:deps

      - name: Circular dependency check
        run: pnpm run check:circular
