name: Visual Tests

# 视觉回归测试（仅跑本地像素对比 + OCR，无需任何 API Key）
# - 触发：push 主分支 / 手动 dispatch（2026-09-17 起不再由 PR 触发，见下方说明）
# - 默认行为：跑像素对比 + 生成 Agent 判断报告（本地全部完成）
# - 判断：Agent 在 PR review 时读取 judge-report.md 并用 view_image 看截图
#
# 2026-09-17 CI 提速：移除 pull_request 触发。
# 原因：本 workflow 与 quality-gate 的 QG Visual（Gate 7）是逐行同构的重复实现
#（同 TEST_URL / HEADLESS / PIXEL_THRESHOLD，同 playwright install → build:vue → vite:5174 →
#  test:visual:pixel → agent-visual-judge），每次改 apps/desktop/** 都会跑两遍、占两台 runner。
# PR 上改由 QG Visual 承担；本 workflow 保留 push / dispatch，以维持「代码默认 readiness 超时」这条
# 路径的覆盖（QG 侧硬编码了 VISUAL_READY_TIMEOUT: "15000"，本处不设该变量）。

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/visual-test.yml'
      - '.github/scripts/workflow-contract.test.js'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  visual-test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      TEST_URL: http://127.0.0.1:5174
      HEADLESS: "true"
      PIXEL_THRESHOLD: "0.06"

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright + Chromium
        run: pnpm exec playwright install chromium

      - name: Build Vue frontend
        run: pnpm --filter @multi-publish/desktop build:vue

      - name: Pixel-comparison tests (default, no API Key needed)
        shell: pwsh
        run: |
          $desktopDir = Join-Path $PWD "apps/desktop"
          $viteProcess = Start-Process -FilePath "pnpm.cmd" `
            -ArgumentList @("exec", "vite", "--host", "127.0.0.1", "--port", "5174") `
            -WorkingDirectory $desktopDir `
            -RedirectStandardOutput (Join-Path $desktopDir "vite-visual.stdout.log") `
            -RedirectStandardError (Join-Path $desktopDir "vite-visual.stderr.log") `
            -WindowStyle Hidden -PassThru
          try {
            $viteReady = $false
            for ($i = 1; $i -le 30; $i++) {
              Start-Sleep -Seconds 1
              $viteProcess.Refresh()
              if ($viteProcess.HasExited) { throw "Vite exited before becoming ready (exit=$($viteProcess.ExitCode))" }
              try {
                if ((Invoke-WebRequest -Uri "http://127.0.0.1:5174/" -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) {
                  Write-Host "Vite ready after $i seconds"
                  $viteReady = $true
                  break
                }
              } catch {}
            }
            if (-not $viteReady) { throw "Vite never became ready" }
            Push-Location $desktopDir
            try {
              pnpm.cmd run test:visual:pixel
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } finally {
              Pop-Location
            }
          } finally {
            if (-not $viteProcess.HasExited) { taskkill /PID $viteProcess.Id /T /F 2>$null | Out-Null }
          }

      - name: Generate Agent visual-judge report
        if: always()
        run: |
          echo "=== Agent Visual Judge ==="
          node apps/desktop/tests/visual-testing/scripts/agent-visual-judge.js

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-reports
          path: |
            apps/desktop/tests/visual-testing/screenshots
            apps/desktop/tests/visual-testing/reports
            apps/desktop/vite-visual.*.log
          retention-days: 5
