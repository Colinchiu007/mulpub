name: GUI Tests

on:
  # 路径判定**不在触发层**：`on.pull_request.paths` 白名单不匹配时整条 workflow 不启动，
  # 于是本检查在 required 语义下是"永远不到来"而不是"跳过"（实测 #3499：只改 openspec/records
  # 的 PR 上 build / electron-tests / 债务熔断检查 都以 skipping 出现，GUI Tests 计数 0）。
  # 白名单本身搬到 scripts/ci-gui-relevance.js，由下面的 changes 作业逐 PR 计算（同 electron-ci 先例）。
  pull_request:
    branches: [main]
  push:
    branches: [codex/gui-test*, main]
    tags: [v*]
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/gui-test.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # GUI 相关性判定（形状照 electron-ci.yml / quality-gate.yml 的 changes 作业；判据本体在
  # scripts/ci-gui-relevance.js，diff 与 glob 复用 classify-docs-only.js，不写第二份）。
  # 取 base/head 走 scripts/ci-pr-changeset.js 而不是直接读 github.event.*.sha：
  # PR 打开后 main 又前进时，checkout 出来的是合并提交，直接算会把别人的提交算进本 PR。
  changes:
    name: GUI Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gui-relevant: ${{ steps.gui.outputs.gui-relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # merge-base diff 需要完整历史

      - name: Detect GUI-relevant changes
        id: gui
        shell: bash
        env:
          EVT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # 非 PR 事件（main push / tag / dispatch）一律照旧全量跑，绝不因这次改动被短路。
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "gui-relevant=true" >> "$GITHUB_OUTPUT"
            echo "gui-relevant=true (non-PR event: full run)"
            exit 0
          fi
          CHANGESET="$(node scripts/ci-pr-changeset.js --repo="$PWD" --evt-name="${{ github.event_name }}" --evt-base="${EVT_BASE_SHA:-}" --evt-head="${EVT_HEAD_SHA:-}")" || exit 1
          echo "[gui-changeset] $CHANGESET"
          BASE="$(printf '%s\n' "$CHANGESET" | sed -n 's/^base=//p')"
          HEAD_SHA="$(printf '%s\n' "$CHANGESET" | sed -n 's/^head=//p')"
          if [ -z "$BASE" ] || [ -z "$HEAD_SHA" ]; then
            echo "::error::取不到本 PR 的 base/head（[${BASE}]/[${HEAD_SHA}]）；不得退回 HEAD=合并提交——那会把期间 main 的他人提交算进本 PR 而误判相关性"
            exit 1
          fi
          node scripts/ci-gui-relevance.js --base="$BASE" --head="$HEAD_SHA" --repo="$PWD"

  gui-test:
    runs-on: windows-latest
    needs: [changes]
    # 相关性短路：不相关的 PR 让本 job 显示为 skipped（skipped 满足 required check 口径，
    # 与 build / electron-tests 同形）。非 PR 事件必须留在条件里，否则 main push 与 tag
    # 发布链路会被 changes 的 "true (non-PR)" 之外的任何漂移一并短路掉。
    if: github.event_name != 'pull_request' || needs.changes.outputs.gui-relevant == 'true'
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install content-aggregator (shared collection engine)
        run: python -m pip install "git+https://github.com/Colinchiu007/content-aggregator.git"

      - name: Install content-aggregator-shared (auth/wechat/proxy)
        run: python -m pip install "git+https://github.com/Colinchiu007/content-aggregator-shared.git"

      - name: Install Python backend runtime and test dependencies
        run: python -m pip install -e "packages/python-backend[web,video,aggregation,test]"

      - name: Verify optional Python provider imports
        run: python -m pytest packages/python-backend/tests/test_video_provider_imports.py -q

      - name: Verify publisher RPA/DOM regressions
        # 此前的系统洞：python-backend 只有 provider import 参与阻断，发布器回归测试
        # （含静态守卫）只在本地实跑，守卫变红依旧无声合入。发布器套件全部纳入本步骤。
        # pytest-asyncio 现由 [test] extra 声明安装，不再在此临时 pip install：
        # 缺它时 @pytest.mark.asyncio 用例会静默不收集，门禁绿而用例是空的。
        working-directory: packages/python-backend
        shell: bash
        run: |
          python -m pytest \
            tests/test_xiaohongshu_dom_hardening.py \
            tests/test_p4_wait_until.py \
            tests/test_new_publishers.py \
            tests/test_douyin_publisher.py \
            tests/test_douyin_rpa_fields.py -q

      - name: Verify Python backend imports
        working-directory: packages/python-backend/src
        run: python -c "import server, uvicorn, yaml; print('Python backend entrypoint imports ready')"

      - name: Install Playwright (for GUI tests)
        run: pnpm exec playwright install chromium

      - name: Build Vue frontend
        run: pnpm --filter @multi-publish/desktop build:vue

      - name: Start Vite server
        shell: bash
        run: |
          set -euo pipefail
          (
            cd apps/desktop
            exec pnpm exec vite --host 127.0.0.1 --port 5174
          ) > apps/desktop/vite-ci.log 2>&1 &
          vite_pid=$!
          echo "$vite_pid" > "./multi-publish-vite.pid"

          vite_ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:5174/ > /dev/null 2>&1; then
              echo "Vite ready after ${i}s"
              vite_ready=1
              break
            fi
            if ! kill -0 "$vite_pid" 2>/dev/null; then
              echo "Vite exited before becoming ready"
              cat apps/desktop/vite-ci.log
              exit 1
            fi
            sleep 1
          done
          if [ "$vite_ready" -ne 1 ]; then
            echo "Vite never became ready"
            cat apps/desktop/vite-ci.log
            exit 1
          fi

      # 2026-09-17 CI 提速：原第 2 条命令 `pnpm --filter @multi-publish/desktop test:e2e`
      # 与 quality-gate 的 QG Browser E2E（Gate 8）完全重复（同一 test:e2e、同一个 vite:5174），已移除。
      # 保留 e2e-smoke.js（本 workflow 独有）。
      # ⚠️ 红线：本文件上方的 5 个 Python 后端验证步骤是全仓唯一入口，不得删除或迁移。
      - name: Browser E2E gates
        shell: bash
        run: |
          set -euo pipefail
          node apps/desktop/tests/e2e-smoke.js

      # L2: Electron GUI gate 仅发布 tag 时触发（CI 虚拟环境无真实 GPU/显示，日常 PR 用 headless Chromium 浏览器 E2E 兜底）
      - name: Electron GUI gate (release-only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          # L1: 硬看门狗 — 超时 8 分钟强制终止，避免 Electron 启动僵尸化挂死整小时（Windows 自托管无需 xvfb）
          timeout --signal=TERM --kill-after=30s 8m \
            node apps/desktop/tests/electron-gui-v9.js

      - name: Stop Vite server
        if: always()
        shell: bash
        run: |
          if [ -f "./multi-publish-vite.pid" ]; then
            vite_pid=$(cat "./multi-publish-vite.pid")
            kill "$vite_pid" 2>/dev/null || true
            wait "$vite_pid" 2>/dev/null || true
          fi

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-test-screenshots
          path: |
            apps/desktop/tests/screenshots/*.png
            apps/desktop/tests/e2e/reports/**
            apps/desktop/tests/visual-testing/reports/**
            apps/desktop/vite-ci.log
          if-no-files-found: warn
          retention-days: 5
