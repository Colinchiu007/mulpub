name: GUI Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/gui-test.yml'
  push:
    branches: [codex/gui-test*, main]
    tags: [v*]
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/gui-test.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gui-test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install content-aggregator (shared collection engine)
        run: python -m pip install "git+https://github.com/Colinchiu007/content-aggregator.git"

      - name: Install content-aggregator-shared (auth/wechat/proxy)
        run: python -m pip install "git+https://github.com/Colinchiu007/content-aggregator-shared.git"

      - name: Install Python backend runtime and test dependencies
        run: python -m pip install -e "packages/python-backend[web,video,aggregation]" pytest

      - name: Verify optional Python provider imports
        run: python -m pytest packages/python-backend/tests/test_video_provider_imports.py -q

      - name: Verify Python backend imports
        working-directory: packages/python-backend/src
        run: python -c "import server, uvicorn, yaml; print('Python backend entrypoint imports ready')"

      - name: Install Playwright (for GUI tests)
        run: pnpm exec playwright install chromium

      - name: Build Vue frontend
        run: pnpm --filter @multi-publish/desktop build:vue

      - name: Start Vite server
        shell: bash
        run: |
          set -euo pipefail
          (
            cd apps/desktop
            exec pnpm exec vite --host 127.0.0.1 --port 5174
          ) > apps/desktop/vite-ci.log 2>&1 &
          vite_pid=$!
          echo "$vite_pid" > "./multi-publish-vite.pid"

          vite_ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:5174/ > /dev/null 2>&1; then
              echo "Vite ready after ${i}s"
              vite_ready=1
              break
            fi
            if ! kill -0 "$vite_pid" 2>/dev/null; then
              echo "Vite exited before becoming ready"
              cat apps/desktop/vite-ci.log
              exit 1
            fi
            sleep 1
          done
          if [ "$vite_ready" -ne 1 ]; then
            echo "Vite never became ready"
            cat apps/desktop/vite-ci.log
            exit 1
          fi

      # 2026-09-17 CI 提速：原第 2 条命令 `pnpm --filter @multi-publish/desktop test:e2e`
      # 与 quality-gate 的 QG Browser E2E（Gate 8）完全重复（同一 test:e2e、同一个 vite:5174），已移除。
      # 保留 e2e-smoke.js（本 workflow 独有）。
      # ⚠️ 红线：本文件上方的 5 个 Python 后端验证步骤是全仓唯一入口，不得删除或迁移。
      - name: Browser E2E gates
        shell: bash
        run: |
          set -euo pipefail
          node apps/desktop/tests/e2e-smoke.js

      # L2: Electron GUI gate 仅发布 tag 时触发（CI 虚拟环境无真实 GPU/显示，日常 PR 用 headless Chromium 浏览器 E2E 兜底）
      - name: Electron GUI gate (release-only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          # L1: 硬看门狗 — 超时 8 分钟强制终止，避免 Electron 启动僵尸化挂死整小时（Windows 自托管无需 xvfb）
          timeout --signal=TERM --kill-after=30s 8m \
            node apps/desktop/tests/electron-gui-v9.js

      - name: Stop Vite server
        if: always()
        shell: bash
        run: |
          if [ -f "./multi-publish-vite.pid" ]; then
            vite_pid=$(cat "./multi-publish-vite.pid")
            kill "$vite_pid" 2>/dev/null || true
            wait "$vite_pid" 2>/dev/null || true
          fi

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-test-screenshots
          path: |
            apps/desktop/tests/screenshots/*.png
            apps/desktop/tests/e2e/reports/**
            apps/desktop/tests/visual-testing/reports/**
            apps/desktop/vite-ci.log
          if-no-files-found: warn
          retention-days: 5
