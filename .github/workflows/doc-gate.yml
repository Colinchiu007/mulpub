name: Doc Sync Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      base:
        description: 'Base branch to diff against (default: main)'
        required: false
        default: 'main'
      head:
        description: 'Head branch name (default: dispatched ref)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  doc-sync:
    name: 文档同步检查
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      pull-requests: read
      issues: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史（draft-changelog 需要）

      - name: 检查 gh CLI
        run: |
          gh --version || (echo "❌ gh CLI 未安装" && exit 1)

      - name: 检查文档同步（硬门禁）
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.event.inputs.base || 'main' }}
          HEAD_REF: ${{ github.event.inputs.head || github.ref_name }}
        run: |
          chmod +x scripts/check-docs-sync.sh
          bash scripts/check-docs-sync.sh \
            --base="${BASE_REF}" \
            --head="${HEAD_REF}"

      - name: 起草 CHANGELOG
        if: github.event_name == 'pull_request'  # 仅 PR 时起草草稿
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          chmod +x scripts/draft-changelog.sh
          mkdir -p team/inbox
          bash scripts/draft-changelog.sh \
            --output=team/inbox/changelog-draft-${PR_NUMBER}.md

      - name: 上传 CHANGELOG 草稿
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: changelog-draft-${{ github.event.pull_request.number }}
          path: team/inbox/changelog-draft-${{ github.event.pull_request.number }}.md
          retention-days: 5

  # 2026-09-17 CI 提速：本 job 原为通用模板残留 —— 两个步骤的条件均不成立而空转
  #（仓库根无 requirements.txt、无 tests/ 目录），且 `pytest ... || echo` 会把失败吞掉，属假门禁。
  # 本仓库单元测试已由 quality-gate 的 Gate 4 / desktop-shards 覆盖，此处无需重复。
  # 保留 job 名与调用形态：`.quality-gates.md` 将「单元测试 + Lint」记为历史 required-check context 名，
  # 保留成本为零，可避免将来启用 required checks 时 context 名失配。
  ci-tests:
    name: 单元测试 + Lint
    runs-on: ubuntu-latest
    steps:
      - name: no-op（保留 job 名以稳定 required-check context 名）
        run: echo "单元测试 + Lint 已由 quality-gate 覆盖；本 job 保留 job 名以稳定 required-check context。"

  # 2026-09-17 CI 提速：已删除原 stale-check job —— 它是纯 echo 占位（仅打印两行提示），
  # 却每次 PR 都启动一台 Windows runner。如需 stale 检查，应另建 schedule 触发的独立 workflow。

# ===== 说明 =====
#
# 启用方式：
#   1. 将本文件复制到各项目的 .github/workflows/doc-gate.yml
#   2. 确保 team/scripts/ 在仓库根目录
#   3. 项目必须用 GitHub（GitLab/Bitbucket 不适用）
#
# 绕过机制：
#   owner 或 reviewer 加 'bypass-doc-gate' label 后可合并
#   （需要在 GitHub 仓库设置中创建该 label）
#
# 调试：
#   本地测试：bash scripts/check-docs-sync.sh --base=main --head=feat/xxx
