name: 债务熔断门禁

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '01-docs/**'
      - 'docs/**'
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  debt-guard:
    name: 债务熔断检查
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: 检查债务预算
        run: node scripts/check-debt-budget.js

      - name: 死代码检测（软门禁，报告供人工审查）
        continue-on-error: true
        run: |
          echo "=== 「测试覆盖但未接线」死代码检测（软门禁）==="
          node scripts/detect-unwired-exports.js apps/desktop/electron/services
          echo "=== 说明：以上候选需人工确认（DI seam/动态引用可能误报），不阻塞 CI ==="
