name: 债务熔断门禁

on:
  pull_request:
    branches: [main]
    # 不得配置 paths-ignore：本 workflow 的 job 显示名「债务熔断检查」是 GitHub ruleset
    # main-ci-gate 的 required check，一旦按路径跳过就不会产生该检查，纯文档 PR 会永久 BLOCKED。
    # 债务预算检查本身只读 scripts/check-debt-budget.js，耗时 <1 分钟，无需省时长。
  push:
    branches: [main]
    # 必须同时监听 push 到 main：本门禁是「扫描全仓当前状态」型断言，只在 pull_request 上跑时，
    # GitHub 检出的是与 base 合并后的树——所以并发 PR 把已删条目带回 main（squash 合并吃掉 base 侧
    # 的删除）不会让任何人的 CI 变红，反而让 main 长期处于违规态；之后每个无关 PR 都会被这条红
    # 卡住（audit-2026-09-22 实测因此逃逸 3 次）。加上 push 后，债在欠债的人身上变红。
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  debt-guard:
    name: 债务熔断检查
    # ⛔ 必须 ubuntu-latest，不得占 windows-latest 的并发额度（2026-10-23 实测）。
    #    本作业三步全是「纯 node + git」：`check-debt-budget.js` / `check-max-lines.js` +
    #    它的 node:test 自测 / `detect-unwired-exports.js` —— **无任何 Windows 专属依赖**
    #    （与 ci-failure-handler.yml 里那条注释同一族理由：那家已经因为同样理由挪到 ubuntu）。
    #    动因：Windows 托管池是本仓最紧的一档，而**主干读数恰恰卡在等 Windows**：
    #    `check-main-red.js` 的基线是「主干链上最后一次完整跑完的那一版」，
    #    主干上排队的作业全是 Windows（债务熔断门禁 / Electron CI / GUI Tests）⇒
    #    门禁基线长时间取不到 ⇒ 每个 PR 的本地判据都停在 STOP_MAIN_RED。
    #    实测 2026-10-23：同批次的纯 ubuntu 作业（quality-gate）零排队，
    #    而本作业在 Windows 池上排队 40+ 分钟。
    #
    #    平台无关性（迁 runner 前必须逐条核过，不能只凭「都是 node」）：
    #      · 行数口径 `fs.readFileSync(fp,'utf8').split(NEWLINE).length` —— CRLF 与 LF 同数
    #        （CRLF 只是一个换行符终结的片段，尾随的 CR 不额外计行）⇒ 读数不受 checkout
    #        的 autocrlf 影响；
    #      · `check-debt-budget.js` 里的路径一律 `.replace(/\\/g,'/')` 归一 ⇒ 两平台同键名；
    #      · `detect-unwired-exports.js` 零平台引用。
    #    ⇒ 判定结果与 runner 无关，作业名（required check 的键）也不变。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          # 必须完整历史：targets 重锚审计要读**base**那份基线（merge-base / HEAD^1），
          # 默认的 fetch-depth: 1 既没有 origin/main 的远程跟踪 ref、也没有父提交
          # ⇒ 取不到 base ⇒ fail-closed 规则恒红（2026-10-23 实测 PR #4337）。
          # 与 quality-gate.yml / doc-gate.yml 的 checkout 同口径。
          fetch-depth: 0

      - name: 检查债务预算
        run: node scripts/check-debt-budget.js

      # 审计 P2·超大文件：debt-budget 是全仓聚合棘轮（maxFileLines / filesOver500 / filesOver1000），
      # 「拆掉一个大文件 + 新写一个大文件」会互相抵消而无人报警；且 eslint max-lines 只覆盖 apps/desktop，
      # Python 侧 1000+ 行文件完全不在行数门禁内。本步做逐文件判定，口径与 debt-budget 一致。
      # 还完债请用 `node .github/scripts/check-max-lines.js --prune <路径>` 单键清账（会同时在 pruned 立碑），
      # 不要跑整份 --update：那会顺手把别人的存量漂移登记成新基线。
      - name: 逐文件行数门禁（新代码阻断 / 存量挂账防腐）
        env:
          CL_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # base 必须取 **merge-base**，不能直接取 origin/main（2026-10-05 实测同族结论）：
          # origin/main 会随 main 前进漂移，而这条棘轮问的是「本 PR 相对自己的起点有没有放宽约束」。
          # pull_request 事件下 actions/checkout 检出的是 merge ref（HEAD = base ⊕ head 的合并提交）
          # ⇒ merge-base(base.sha, HEAD) 即事件时刻的 base；push 事件下 CL_BASE 为空 ⇒ 回落 HEAD^
          # （squash 合并 = 单提交，语义正确）。回落方向是「更严」而非「更松」。
          BASE_REF="${CL_BASE:-HEAD^}"
          MB="$(git merge-base "$BASE_REF" HEAD 2>/dev/null || true)"
          echo "[max-lines] base_ref=$BASE_REF merge_base=${MB:-<unresolved => fallback to base_ref>}"
          MP_BASE_REF="${MB:-$BASE_REF}" node .github/scripts/check-max-lines.js
          node --test .github/scripts/check-max-lines.test.js

      - name: 死代码检测（软门禁，报告供人工审查）
        continue-on-error: true
        run: |
          echo "=== 「测试覆盖但未接线」死代码检测（软门禁）==="
          node scripts/detect-unwired-exports.js apps/desktop/electron/services
          echo "=== 说明：以上候选需人工确认（DI seam/动态引用可能误报），不阻塞 CI ==="
