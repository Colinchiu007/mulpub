# ci-failure-handler.yml - Level 4: CI 失败自动创建 Issue + 通知
#
# 工作流:
#   1. 任何 CI workflow 失败 -> 触发本工作流
#   2. 解析失败原因
#   3. 创建 Bug Issue (含 CI 日志链接 + 失败原因)
#   4. 在 PR 页面留评论
#
# 关键设计: 不调用 LLM API, 只创建 Issue + 通知
# 真正的修复由 user 本地跑 auto-bug-fix.py --auto-fix 完成

name: CI Failure Handler (Level 4)

on:
  workflow_run:
    # 不变量（由 scripts/check-schedule-failure-watch.test.js 的 Gate 2b13 机械守住，两条方向都要成立）：
    #   ① 凡带 `on.schedule:` 的作业必须出现在这份名单里 —— 定时作业没有 PR、没有人在盯，
    #      挂十天也不会在任何合并路径上显形（Cleanup Artifacts 的定时 run 连红 9 次就是这么漏过去的）；
    #   ② 名单里的每个名字必须还能在 .github/workflows/*.yml 的 `name:` 上找到 —— 改名或删作业
    #      而名单留着，读起来像"已覆盖"，实际那条永远不会触发。
    workflows: [
      "Build & Release",
      "Electron CI",
      "quality-gate",
      "GUI Tests",
      "Doc Sync Gate",
      "Cleanup Artifacts",
      "时钟位移引信巡检",
      "依赖漏洞审计门禁",
      "Sidecar Parity (cross-repo)",
      "定时作业心跳巡检",
    ]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  handle-ci-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    # ⛔ 必须 ubuntu-latest，不得占 windows-latest 的并发额度（2026-10-22，change: main-red-run-baseline）。
    #    本作业只跑 gh CLI + node + setup-python，无任何 Windows 专属依赖（实测
    #    .github/scripts/classify-ci-failure.js 无 win32/windows/powershell 命中）。
    #    迁移前的实测代价：electron-tests / GUI Tests / 本 handler 三家全在 windows-latest 抢同一个
    #    托管池，主干 push 的 electron-tests 作业实测排队 46.6 分 / 51.5 分才起跑；而同批次的纯
    #    ubuntu 作业（quality-gate）**零排队**。Windows 额度是「主干读数拿不到」的直接放大器。
    #    同型先例：quality-gate 的 changes 作业早已锁死为 ubuntu-latest，理由原文
    #    「判定只依赖 git+node，必须用 ubuntu（不占 Windows 并发额度）」。
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 解析 CI 失败原因
        id: parse-failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 事件载荷一律走 env，不在 run: 正文里内联 ${{ }}。GitHub 做的是**字面替换**，
          # 而 `workflow_run.name` 由失败那个工作流文件自己声明 —— fork 的 PR 想写什么
          # 写什么，里面一个双引号就能把整段 bash 截断接上任意命令（本 handler 有 issues:
          # write / pull-requests: write）。下面两个步骤早就按这条口径写了注释，这里曾是漏项。
          EVT_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          EVT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVT_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          EVT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EVT_REPO: ${{ github.repository }}
        run: |
          WORKFLOW_NAME="$EVT_WORKFLOW_NAME"
          COMMIT_SHA="$EVT_HEAD_SHA"
          PR_NUMBER="$EVT_PR_NUMBER"
          RUN_ID="$EVT_RUN_ID"
          REPO="$EVT_REPO"

          echo "WORKFLOW_NAME=$WORKFLOW_NAME" >> $GITHUB_OUTPUT
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "RUN_ID=$RUN_ID" >> $GITHUB_OUTPUT

          # 分类判据来自真实载荷（jobs + check-run annotations），不再写常量。
          # 这一步自身失败时必须回落成改动前的行为（TYPE=ci-failure + 照常开单）：
          # 本仓 bash 默认带 -e，不兜底会让 handler 直接变红、一张单都不开 —— 那是
          # 用"少噪声"换来"丢故障"，方向反了。
          if ! node .github/scripts/classify-ci-failure.js \
              --repo "$REPO" --run-id "$RUN_ID" --workflow "$WORKFLOW_NAME" \
              --run-attempt "$EVT_RUN_ATTEMPT" --output "$GITHUB_OUTPUT"; then
            echo "WARN classify-ci-failure 不可用，回落到旧行为（照常开单，签名退化为分类器不可用）" >&2
            {
              echo "TYPE=ci-failure"
              echo "SIGNATURE=${WORKFLOW_NAME}::classifier-unavailable::classifier-unavailable::exit=unknown"
              echo "TITLE=ci-failure[ci-failure] ${WORKFLOW_NAME}: 分类器不可用"
              echo "ROOT_JOB="
              echo "ROOT_STEP="
              echo "EXIT_CODE="
              echo "TRACKED_IN="
              echo "FILE_ISSUE=true"
              echo "EVIDENCE=classifier unavailable"
            } >> $GITHUB_OUTPUT
          fi

      - name: 检查是否已有 Issue
        id: check-duplicate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ steps.parse-failure.outputs.TITLE }}
          TRACKED_IN: ${{ steps.parse-failure.outputs.TRACKED_IN }}
        run: |
          # 去重键从 `ci-failure-<sha>` 换成**签名标题**：同因复发命中同一张单。
          # 旧写法使每个失败提交开一张新单 —— 实测 2026-09-28 累积 open 单 790 张
          # （跨 2026-08-13→09-28），其中 Electron CI 那批全是 #2458 那道 20m 预算墙。
          # 带方括号/冒号的标题必须整体加引号做短语检索，否则 GitHub search 会当语法解析。
          EXISTING=$(gh issue list \
            --search "\"$TITLE\" in:title" \
            --state all \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$TRACKED_IN" ]; then
            echo "EXISTING_ISSUE=$TRACKED_IN" >> $GITHUB_OUTPUT
            echo "DUPLICATE=true" >> $GITHUB_OUTPUT
            echo "该形状已有跟踪项 #$TRACKED_IN，只追评不开单"
          elif [ -n "$EXISTING" ]; then
            echo "DUPLICATE=true" >> $GITHUB_OUTPUT
            echo "EXISTING_ISSUE=$EXISTING" >> $GITHUB_OUTPUT
            echo "Issue #$EXISTING 已存在（同一签名），本次只追评复发记录"
          else
            echo "DUPLICATE=false" >> $GITHUB_OUTPUT
          fi

      - name: 复发追评（已有同签名单或已知基础设施跟踪项）
        if: steps.check-duplicate.outputs.DUPLICATE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 分类结果一律走 env 传给脚本，不内联 ${{ }}：GitHub 是**字面替换**进脚本文本，
          # 步骤名里出现一个引号就能打断整段 bash（这些值来自 CI 载荷，属不可控文本）。
          ISSUE: ${{ steps.check-duplicate.outputs.EXISTING_ISSUE }}
          CI_TYPE: ${{ steps.parse-failure.outputs.TYPE }}
          ROOT_JOB: ${{ steps.parse-failure.outputs.ROOT_JOB }}
          ROOT_STEP: ${{ steps.parse-failure.outputs.ROOT_STEP }}
          EXIT_CODE: ${{ steps.parse-failure.outputs.EXIT_CODE }}
          SIGNATURE: ${{ steps.parse-failure.outputs.SIGNATURE }}
          COMMIT_SHA: ${{ steps.parse-failure.outputs.COMMIT_SHA }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          cat > ./ci-recurrence.md << RECURRENCE_END
          ### 同一签名再次失败（不重复开单）

          - 分类: $CI_TYPE
          - 根因作业/步骤: $ROOT_JOB / $ROOT_STEP
          - 进程退出码: $EXIT_CODE
          - Commit: $COMMIT_SHA
          - 运行: $RUN_URL

          去重签名: \`$SIGNATURE\`
          RECURRENCE_END
          gh issue comment "$ISSUE" --body-file ./ci-recurrence.md

      - name: 创建 Bug Issue
        if: steps.check-duplicate.outputs.DUPLICATE == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW: ${{ steps.parse-failure.outputs.WORKFLOW_NAME }}
          SHA: ${{ steps.parse-failure.outputs.COMMIT_SHA }}
          PR: ${{ steps.parse-failure.outputs.PR_NUMBER }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CI_TYPE: ${{ steps.parse-failure.outputs.TYPE }}
          ROOT_JOB: ${{ steps.parse-failure.outputs.ROOT_JOB }}
          ROOT_STEP: ${{ steps.parse-failure.outputs.ROOT_STEP }}
          EXIT_CODE: ${{ steps.parse-failure.outputs.EXIT_CODE }}
          SIGNATURE: ${{ steps.parse-failure.outputs.SIGNATURE }}
          EVIDENCE: ${{ steps.parse-failure.outputs.EVIDENCE }}
          FAILING_TEST: ${{ steps.parse-failure.outputs.FAILING_TEST }}
          TITLE: ${{ steps.parse-failure.outputs.TITLE }}
          ACTOR: ${{ github.actor }}
        run: |
          # 正文直接用展开型 heredoc 拼：旧写法是「占位符 + 9 条 sed」，
          # 而 sed 的替换串里 & 与 | 都有语义，值一含这些字符就把正文改坏。
          cat > ./ci-issue-body.md << ISSUE_BODY_END
          ## CI 失败 - Level 4 自动检测

          - 工作流: $WORKFLOW
          - Commit SHA: $SHA
          - PR: #${PR}
          - 运行链接: $RUN_URL

          ---

          ## 检测到的问题

          - 失败类型: $CI_TYPE
          - 根因作业: $ROOT_JOB
          - 根因步骤: $ROOT_STEP
          - 进程退出码: $EXIT_CODE
          - 失败用例: ${FAILING_TEST:-未识别（该步骤非测试类，或日志里没有 FAIL 行）}
          - 去重签名: \`$SIGNATURE\`

          取证: $EVIDENCE

          > 同一签名再次失败不再重复开单，会追评在本单下。
          > 旧版这里写的是常量「失败类型: ci-failure / 可自动修复: 是」，且去重键是 per-commit，
          > 于是同一个根因每个提交开一张单（实测 2026-09-28 open 单 790 张，跨 2026-08-13→09-28）。

          ---

          ## 修复步骤（用户手动）

          1. 在本地拉取最新代码并切到失败分支
          2. 运行自动修复: \`python ../team/scripts/auto-bug-fix.py "CI 失败" --auto-fix\`
          3. agent 会读 .bug-diagnosis-needed.json 诊断并写修复代码
          4. 自动 commit + push
          5. CI 自动重跑

          ---

          详见 PROTOCOL.md 第 14 章
          ISSUE_BODY_END

          # 标签保持既有集合：TYPE 是分类器动态值，仓库里并没有 ci-timeout-budget 这类标签，
          # gh issue create 遇到未知标签会直接失败 —— 分类信息已在标题里（ci-failure[<type>]）。
          gh issue create \
            --title "$TITLE" \
            --body-file ./ci-issue-body.md \
            --label "bug,ci-failure,level-4" \
            --assignee "$ACTOR"

      - name: 在 PR 留评论
        if: steps.parse-failure.outputs.PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.parse-failure.outputs.PR_NUMBER }}
        run: |
          cat > ./ci-pr-comment.md << 'PR_COMMENT_END'
          ## Level 4: CI 失败已检测

          - 已自动创建 Bug Issue
          - 详见 PROTOCOL.md 第 14 章

          ### 修复方法（用户手动）

          在本项目根目录运行:

          python ../team/scripts/auto-bug-fix.py "CI 失败" --auto-fix

          agent (Hermes 会话中的 LLM) 会:
          1. 自动诊断失败原因
          2. 写修复代码
          3. 自动 commit + push
          4. 触发 CI 重跑
          PR_COMMENT_END

          gh pr comment "$PR" --body-file ./ci-pr-comment.md

      - name: 完成
        run: |
          echo "CI Failure Handler Level 4 完成"