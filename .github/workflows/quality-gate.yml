name: quality-gate

on:
  push:
    branches: [main]
    paths-ignore:
      - '01-docs/**'
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
      - '.ccg/**'
      - '.claude/**'
      - '.hermes/**'
      - '.agents/**'
      - 'openspec/**'
      - 'scripts/gate-record-debt-ledger.json'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:  # 必需保留，用于手动触发质量节拍检查

# 并发控制：同一 PR 多次推送只保留最新一次（避免旧 run 继续占用并发额度）；
# main push 不取消（保发布链路完整性）。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --- docs-only 短路判定（change: docs-only-ci-shortcircuit）---
  # 红线不变：pull_request 触发级 paths-ignore 仍被 workflow-contract.test.js 禁止
  # （PR #2151 死锁：触发级过滤会让 required check 永不产生）。本 job 是 job 级短路：
  # workflow 照常触发 => 所有 required check context 都出现；被 if 跳过的 job 显示
  # skipped => required check 视为满足；gate-result 的 $allowed 含 'skipped' 即为此口径。
  # 判定真源是 scripts/classify-docs-only.js（fail-closed：空 diff / git 失败 / 混合
  # 变更一律 false=全量）。git 失败时本 job 红，gate-result 会拦（不静默放行）。
  changes:
    name: QG Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # merge-base diff 需要完整历史（与 build.yml package-relevant 同模式）

      - name: Detect docs-only changes
        id: classify
        shell: bash
        run: |
          # 账本 JSON 在 docs-only 白名单里 ⇒ 校验它的门禁不能只待在会被短路的 static-gates。
          # 放在非 PR 早退之前，所以 main push 那一档同样覆盖。
          node --test scripts/check-gate-record-debt.test.js
          node scripts/check-gate-record-debt.js
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            echo "docs-only=false (non-PR event: full run)"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          node scripts/classify-docs-only.js --base="$BASE" --repo="$PWD"

  static-gates:
    name: QG Static
    runs-on: windows-latest
    needs: [changes]
    # docs-only 短路：纯文档 PR 跳过重型 job（skipped 满足 required check）
    if: needs.changes.outputs.docs-only != 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史（与 origin/main 计算 merge-base/diff 需要；对齐 doc-gate.yml）

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # --- Gate 1: TypeScript 编译检查（严格卡点） ---
      - name: "Gate 1 - TypeScript 编译检查"
        run: cd apps/desktop && pnpm exec tsc --noEmit

      # --- Gate 2: 核心 JS 文件语法检查（FUSE 断点保护）---
      - name: "Gate 2 - JS syntax integrity (detect FUSE truncation)"
        run: |
          $errors = 0
          Get-ChildItem -Recurse -Filter "*.js" -Path apps/desktop/electron -Exclude "*node_modules*" | ForEach-Object {
            $result = node --check $_.FullName 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Host "  [FAIL] $($_.FullName)"
              $errors++
            }
          }
          if ($errors -gt 0) { exit 1 }
          Write-Host "All Electron JS files pass syntax check"

      # --- Gate 2b: 桌面 dev 启动脚本单测（worktree 独立端口/退出留痕/Electron 环境净化回归保护）---
      # shell: bash 是必需的而不是风格：PowerShell 步骤里一个 run 块的多条命令**不 fail-fast**，
      # 只有最后一条的 $LASTEXITCODE 决定步骤成败（实测见 scripts/check-step-failfast.js 头注释）。
      - name: "Gate 2b - Desktop dev scripts (node --test)"
        shell: bash
        run: |
          node --test apps/desktop/scripts/dev-ports.test.js apps/desktop/scripts/dev-launcher.test.js apps/desktop/scripts/dev-exit-log.test.js apps/desktop/scripts/electron-runtime-env.test.js
          # 打包暂存端剪枝的回归锁（#2765）：extraResources 的第二条通道把仓库树里的测试文件带进
          # app.asar 之外的松散树，判据与门禁共享同一实现（shared-utils/artifact-test-pattern）
          node --test apps/desktop/scripts/stage-remotion-runtime.test.js
          # 01-docs 忽略规则回归锁（#2792 复盘：「01-docs 递归 .md」全量忽略曾让正式文档
          # 静默不入库，PRD 链接 404；见 apps/desktop/scripts/gitignore-docs.test.js 头注释）
          node --test apps/desktop/scripts/gitignore-docs.test.js
          node --test scripts/sync-platform-config.test.js
          node --test scripts/compare-scheduler-models.test.js
          # 会话隔离入口脚本的结构锁：native stderr 捕获不得处在 EAP=Stop 作用域内
          # （否则 worktree 已建成也会以 rc=1 中止，见 scripts/start-mp-task.test.js 头注释）
          node --test scripts/start-mp-task.test.js
          # openspec-sync-check.test.js 自带「镜像与真源逐字节一致」锁，但历史上从未被任何
          # workflow 收集（CI 只显式挂 scripts 下 5 个测试文件，无通配），锁等于没在跑；在此收编。
          node --test scripts/openspec-sync-check.test.js
          # 质量节拍 vendored 契约镜像（.quality-rhythm/）与 openspec 真源的漂移锁
          node --test scripts/quality-rhythm-spec-mirror.test.js
          # Windows PowerShell 5.1 读**无 BOM** 的 .ps1 时按 ANSI 码页解码，中文注释/字符串可让
          # 整个脚本 tokenize 失败（实测 2026-09-29：15 个含非 ASCII 的 .ps1 里 8 个已不可解析，
          # 其中包括会话隔离入口 start-mp-task.ps1 ⇒ 所有新任务的 worktree 都开不出来，
          # 而 pwsh 7 默认 UTF-8 看不见这件事）。判据与三条 fail-closed 约束见 .github/scripts/check-ps1-bom.js
          node --test .github/scripts/check-ps1-bom.test.js
          node .github/scripts/check-ps1-bom.js
          # 打包配置的测试文件排除（#2702）：本仓约定单测与被测代码同目录，而 build.files 里
          # electron 与 node_modules 两条整目录通配曾把 462 个 *.test.* 打进 app.asar
          # （含内部接口形状、平台端点与错误码字符串）。这里守"声明还在"，
          # 产物侧的"声明确实生效"由 Build & Release 里 --asar 那一步守（两个维度互相看不见对方）。
          node --test .github/scripts/check-asar-test-files.test.js
          node .github/scripts/check-asar-test-files.js

      # --- Gate 2c: 测试收集接线棘轮 + 此前从未被 CI 收集的锁 ---
      # 本仓不自动收集 scripts/ 与 .github/scripts/ 下的测试（vitest 只管 workspace，
      # 根 test 脚本是 pnpm -r），新写一条不登记就等于没写。以下条目即由
      # scripts/check-unwired-tests.js 扫出后收编的；shell: bash 与 doc-gate.yml 同形
      # （windows-latest 上已验证 bash 可用）。
      - name: "Gate 2c - Unwired-test ratchet (node --test / bash)"
        shell: bash
        run: |
          node --test scripts/check-unwired-tests.test.js
          node --test scripts/branch-naming-contract.test.js
          node --test .github/scripts/check-ipc-bridge.test.js
          node --test scripts/detect-unwired-exports.test.js
          node --test scripts/ensure-desktop-deps.test.js
          node --test scripts/release-gate.test.mjs
          node --test scripts/sync-version.test.mjs
          bash scripts/hooks/post-checkout.test.sh
          bash scripts/hooks/pre-commit.test.sh
          bash scripts/session-init.test.sh
          node --test scripts/check-step-failfast.test.js
          node scripts/check-step-failfast.js
          # 账本门禁不在此处：账本 JSON 已进 docs-only 白名单，而本 job 整个被 docs-only 门控，
          # 留在这里等于「纯文档 PR 没人校验账本」。它现在在无条件执行的 changes job 里。
          # docs-only 短路判定单一真源的回归锁（change: docs-only-ci-shortcircuit）
          node --test scripts/classify-docs-only.test.js
          node scripts/check-unwired-tests.js

      # --- Gate 2c2: 执行记录存在性判据（change: enforce-gate-record-presence）---
      # 拦的是「PR 合并时整篇没写执行记录」：既有 check-gate-record-debt 两条判据都以"记录存在"
      # 为前提（一条看已存在的行是否收口、一条看最顶部那篇是否带行），对整篇缺席免疫 ——
      # #2570 自己在「遗留」里写明了这点。实测窗口内 111/210 个 PR 没把记录落在可检查位置。
      #
      # 第一步 = advisory：判据打印 `MODE=advisory` 并恒退出 0。**转阻断的动作是删掉下面那行的
      # `--mode=advisory`** —— 该标记行被 check-pr-exec-record.test.js 钉住（design D8），
      # 所以这一步不会像 release-gate 的视觉项那样长期停在"人工核查"而无人察觉。
      #
      # env 显式声明 EXEC_BASE（run 正文里不写内联 ${{ }}）：push 事件它为空，脚本自己走
      # "非 PR 事件不适用"分支，避免每个 push run 被一条不适用自己的判据判红。
      - name: "Gate 2c2 - Execution-record presence (node --test / bash)"
        shell: bash
        env:
          EXEC_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          node --test scripts/check-pr-exec-record.test.js
          node scripts/check-pr-exec-record.js --base="${EXEC_BASE:-}" --head=HEAD --mode=advisory

      # --- Gate 2d: PowerShell 侧此前从未被 CI 收集的锁 ---
      # 分档依据：本机 pwsh 7.6 与 Windows PowerShell 5.1 各跑一遍 + **本步在 runner 上的首跑结果**。
      # 下面 6 条：**前 5 条已在 runner 的 pwsh 7 下实测 rc=0**（#2516 留痕），第 6 条
      # worktree-fs-longpath 由本 PR 首次回接、其成败以本 run 的这一步为准。其中
      # applive-foreign-audit 与 start-desktop-profile-lock
      # 带小写 `#requires -Version 7`，在 5.1 下是 ScriptRequiresUnmatchedPSVersion 根本没执行
      # （grep 时 `-i` 才能命中，按 `#Requires` 大写找会漏）。
      # worktree-fs-longpath 曾在此之后加一步 `shell: powershell` 单独跑，实测在 runner 上仍红
      # （同一条负控「未加 \\?\ 前缀的 IO.Directory::Delete 应当失败」unexpectedly succeeded），
      # 当时被撤下并登记进 KNOWN_UNWIRED。现已回接：那条负控把「本进程能不能走长路径」写死了，
      # 而它实际由注册表 LongPathsEnabled 与该 exe 清单是否 longPathAware 共同决定（pwsh 7 带、
      # 5.1 不带，且 .NET FW 4.6.2+ 在 OS 开启后自己补前缀）。改为运行时探针实测本进程能力再选
      # 期望：不能走长路径 ⇒ 仍要求「未加前缀必须失败」（这才证明夹具够深、正控有意义）；
      # 能走 ⇒ 只要求结果与探针一致，深浅由该文件第 2 节的 depth>260 硬断言守住。
      # 本机两档各命中一条支路实跑（pwsh 7 capable / 5.1 not-capable，各 28 条 PASS）。
      # session-write-guard 曾在撤下名单里：改成 fail-fast 后暴露它在 runner 上本就红
      # （`FAIL: shared status stays clean after tracked restore`，本机绿）。根因已定位并修掉，
      # 不在守卫也不在 runner 的特殊性，而在夹具两处与真实工作树不同形：索引由 `git add`
      # 现场建立（不带 git 的换行转换状态），以及工作树 EOL 形态留给宿主 core.autocrlf 决定
      # （本机 false=LF、runner 默认 true=CRLF）。现已改为 clone 出工作树 + 夹具自带
      # `* text eol=lf` / `* text eol=crlf` 两档都跑；本机以 GIT_CONFIG_GLOBAL 注入
      # autocrlf=true 复现 runner 档位后，两 shell × 有/无全局身份 4 组组合各 34 条全绿。
      # 本步骤整体用 shell: bash —— 旧版用 pwsh 时，前一条测试抛 FAIL 后步骤仍报 success
      # （实测 run 36313053992 的 step 11 之后继续跑完并绿），等于装饰性门禁。
      #
      # 上面那句「下面 6 条」是历史注释（写时确为 6 条），现在共 9 条。第 9 条是本 PR 接入的
      # get-test-process-tree：它把 Gate 4 / Desktop shards 那段进程树遍历的 PID 复用误判钉成
      # 确定性夹具（注入进程表，不碰任何真实进程），反证 = 把时间防护改成恒不成立，第 1 条
      # 断言立刻报出 csrss/winlogon/fontdrvhost/dwm 四个 PID。本机 pwsh 7 与 5.1 各 7 条 PASS。
      # 第 7 条
      # install-session-isolation-task 由 #2551 接入、其"零计划任务"档在 runner 上实测过
      # （run 36390636981 打印 LIVE_TASK_COUNT=0 + 7 条 PASS）。第 8 条是本 PR 接入的
      # session-isolation-automation：它前 10 条断言要求"主工作区 + 分支名为 main + hooks 已装"，
      # 而后 8 条要求"能注册计划任务但不得碰生产路径"。CI 给的三样都不满足 ——
      # actions/checkout 是 detached HEAD（健康检查 line 106 的 -RequirePrimary 硬要 branch=main）、
      # CI 从不装 hooks、PR 合并流程也不会装。⛔ 所以**不改断言，改夹具**：在 $RUNNER_TEMP 里
      # 造一个自有临时 clone（--no-hardlinks 防与 job 工作区共享对象），checkout -B main 并复制
      # scripts/hooks/{pre-commit,post-checkout} 进它的 .git/hooks，然后在 clone 内跑测试。
      # 该配方已在本机把 runner 态复现出来实跑过（两档 shell 各 18 条 PASS，健康检查
      # primary=true/branch=main/clean=true）；"注册成功 vs 0x80070005 拒绝"两条支路测试自己
      # 会按实测选期望（#2521 那条口径），因此不依赖 runner 令牌是否提权。
      # 注：--depth 在本地路径克隆里会被 git 忽略（实测 warning），所以不写它——
      # 写了就是一条不生效还误导人的参数。
      - name: "Gate 2d - PowerShell locks never collected by CI (pwsh 7)"
        shell: bash
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/applive-foreign-audit.test.ps1
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/mp-worktree-health.test.ps1
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/session-guard.test.ps1
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/session-write-guard.test.ps1
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/install-session-isolation-task.test.ps1
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/worktree-fs-longpath.test.ps1
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/start-desktop-profile-lock.test.ps1
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/get-test-process-tree.test.ps1
          # 第 8 条：夹具 = $RUNNER_TEMP 下的临时 clone（分支名 main + 两个 hook 就位）
          ISO="$RUNNER_TEMP/mp-iso-fixture"
          rm -rf "$ISO"
          git clone -q --no-hardlinks "$(pwd -W)" "$ISO"
          git -C "$ISO" checkout -q -B main
          COMMON=$(git -C "$ISO" rev-parse --path-format=absolute --git-common-dir)
          cp "$ISO/scripts/hooks/pre-commit" "$COMMON/hooks/pre-commit"
          cp "$ISO/scripts/hooks/post-checkout" "$COMMON/hooks/post-checkout"
          pwsh -NoProfile -ExecutionPolicy Bypass -File "$ISO/scripts/session-isolation-automation.test.ps1"

      # --- Gate 3: 硬编码密钥扫描（同时执行 CI workflow 契约测试）---
      - name: "Gate 3 - Hardcoded secrets scan"
        run: |
          node --test .github/scripts/check-hardcoded-secrets.test.js .github/scripts/workflow-contract.test.js .github/scripts/autonomous-loop-workflow.test.js .github/scripts/agent-review-gate.test.js .github/scripts/classify-ci-failure.test.js .github/scripts/ci-failure-handler-contract.test.js
          node .github/scripts/check-hardcoded-secrets.js

      # --- Gate 6: IPC bridge completeness ---
      - name: "Gate 6 - IPC bridge completeness"
        id: ipc-check
        run: |
          node .github/scripts/check-ipc-bridge.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          echo "IPC_CHECK=PASS" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # --- Gate 7: locale 内容同步（i18n-content-sync：zh/en 成对提交 + 渲染端硬编码扫描） ---
      # PowerShell 多行 step 只取最后一条命令的退出码，中间命令失败会被静默吞掉。
      # 2026-09-12 修复：每条命令后显式检查退出码，任一失败立即退出（与 Gate 6 同模式）。
      # 事故背景：PR #1719/#1732 的 18 处硬编码中文曾因本缺陷从未被 CI 拦截（--cjk FAIL 但 job success）。
      - name: "Gate 7 - locale content sync (zh/en paired + renderer CJK + key existence + python CJK)"
        run: |
          git fetch origin main --no-tags
          node --test .github/scripts/check-locale-sync.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .github/scripts/check-locale-sync.js --pair-base origin/main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .github/scripts/check-locale-sync.js --cjk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .github/scripts/check-locale-sync.js --keys
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .github/scripts/check-locale-sync.js --py-cjk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # --- Gate 10: 前端一致性卡点（desktop-ui-consistency：IPC 单轨 + 确认原语统一）---
      - name: "Gate 10 - Frontend consistency (renderer IPC single-track + confirm primitive)"
        run: |
          node --test .github/scripts/check-frontend-consistency.test.js
          node .github/scripts/check-frontend-consistency.js

      # --- Gate 11: ESLint（error 级门禁；warning 不阻断，走 pnpm run lint:warnings 观察）---
      # 2026-09-14 接入：接入前 main 存活 17 个 error 长期无人暴露（含 4 个 no-undef 真 bug）。
      # 与本地 `pnpm run lint`（--quiet）同口径；生成物 preload bundle 已在 eslint.config.mjs ignores 排除。
      - name: "Gate 11 - ESLint (error-level gate)"
        run: |
          cd apps/desktop
          pnpm exec eslint electron/ src/ --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # --- Gate 12: 品牌残留门禁（naming-normalization：防止参考产品品牌词再次进入仓库）---
      # 2026-09-15 接入：字节级（latin1 保真）扫描全部 tracked 文本文件，兼容含 NUL 字节与非 UTF-8 文件；
      # 跳过锁文件与二进制扩展名；品牌词按码点构造进正则（门禁脚本自身零字面品牌词）；
      # 唯一豁免第三方远程签名服务域名（signer.js 默认端点，发布链路硬依赖）。
      # 本地同口径：node scripts/check-no-brand-residue.js
      - name: "Gate 12 - Brand residue (naming normalization)"
        run: |
          node --test scripts/check-no-brand-residue.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-no-brand-residue.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # --- Gate 13: 路由入口登记（desktop-ui-consistency T0-5：拦住新增暗路由）---
      # 2026-09-17 接入：src/router/index.js 新增非 redirect 路由却未在
      # src/config/route-registry.js 登记（含 internal/entryFrom）即失败。
      # 与 Gate 6/7/12 同模式：每条命令后显式检查退出码（PowerShell 多行 step 只取最后一条
      # 命令的退出码，中间命令失败会被静默吞掉 —— 见 PR #1719/#1732 事故）。
      # 本地同口径：node .github/scripts/check-route-registry.js
      - name: "Gate 13 - Route registry completeness (route entry registry)"
        run: |
          node --test .github/scripts/check-route-registry.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .github/scripts/check-route-registry.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # --- Gate 14: 历史品牌色字面量（desktop-ui-consistency T1-1：拦住四套 token 收编后的复辟）---
      # 2026-09-18 接入：cohere/apple 旧 token 文件已全部转发 tokens.css 后，
      # 历史色（#5048e5/#5149e8/#409eff/#3a7be5/#007aff/#f472b6）只允许出现在
      # tokens.css 收编槽位区；组件/视图新增历史色字面量即失败。
      # 基线 frontend-consistency-baseline.json colorLiterals 只降不升（存量 145 由后续批次清零）。
      # 本地同口径：node .github/scripts/check-color-literals.js
      - name: "Gate 14 - Color literals guard (token alias consolidation)"
        run: |
          node --test .github/scripts/check-color-literals.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .github/scripts/check-color-literals.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # --- Gate 15: Vue style blocks parse (postcss strict) ---
      # 2026-09-19: CSS 块注释里形如 --color-xxx-* 紧跟斜杠会让星号加斜杠提前闭合注释，
      # 后续文字被 postcss 当 CSS 解析 → vite build 失败，而 vitest 单测完全发现不了
      # （本项目已连续三次因此构建变红：ViralAnalysis #1962 / Collection / Intelligence #2003）。
      # 本地同口径：node .github/scripts/check-vue-style-parse.js
      - name: "Gate 15 - Vue style blocks parse (postcss strict)"
        run: |
          node --test .github/scripts/check-vue-style-parse.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .github/scripts/check-vue-style-parse.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # --- Gate 15b: scoped 样式块裸 :root 选择器门禁（QM-5 回归保护 · PR #2075/#2114 事故反哺） ---
      # Vue scoped 块中写 :root {} 会编译为 :root[data-v-xxx] 永不匹配 html，
      # 块内 CSS token 静默失效 → 看板 hero 白字白底隐形，单测与 headless 截图均拦不住。
      # 本地同口径：node .github/scripts/check-scoped-root.js
      - name: "Gate 15b - Scoped style block bare :root guard"
        run: |
          node --test .github/scripts/check-scoped-root.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .github/scripts/check-scoped-root.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # --- Gate 15c: 未定义 CSS 变量引用扫描（PR #2075 白卡隐形事故反馈） ---
      # var(--x) 无 fallback 且 --x 从未定义 → 整条声明失效（渲染隐形类缺陷，单测与截图均拦不住）；
      # 源码层全前端扫描，存量锁基线递袬只降不升。
      # 本地同口径：node .github/scripts/check-css-var-defined.js
      - name: "Gate 15c - Undefined CSS var reference guard"
        run: |
          node --test .github/scripts/check-css-var-defined.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .github/scripts/check-css-var-defined.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # --- Gate 16: 字号七档（T1-6）---
      # font-size 字面量只降不升（基线模式），应使用 var(--font-size-*) 七档槽
      # 本地同口径：node .github/scripts/check-font-size-scale.js
      - name: "Gate 16 - Font size scale (7-step tokens)"
        run: |
          node --test .github/scripts/check-font-size-scale.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .github/scripts/check-font-size-scale.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # --- Gate 17: IPC sender 守卫覆盖（体检报告问题 14 / P1-14）---
      # 事故背景：10 个 service 的 `injectedIpcMain || require('electron').ipcMain` 回退写法，
      # 漏注入即静默注册到全局 ipcMain，同时绕过 isTrustedSender 来源校验与许可证/权益门禁。
      # 本卡点固化单一口径（递归 electron 全量 .handle 注册点），并做双校验：
      #  1) 清单式：不可判定注册点必须逐条登记在 electron/ipc-guard-exemptions.json（陈旧条目同样失败）；
      #  2) 比例式：显式 withSenderCheck 占比不得低于清单里的 minGuardedRatio（只允许上调）。
      # global/fallback 两类绕过路径不可豁免。本地同口径：node .github/scripts/check-ipc-sender-guard.js
      - name: "Gate 17 - IPC sender guard coverage (ipc-handlers + services)"
        run: |
          node --test .github/scripts/check-ipc-sender-guard.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .github/scripts/check-ipc-sender-guard.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # --- Gate 18: 管理后台会话卫生（体检报告问题 15 / P1-15）---
      # 事故背景：POST /api/auth/login 把 HS256 JWT 放在响应体，前端存 localStorage 并手工拼
      # Authorization 头 ⇒ 任意 XSS 即可外带管理员凭据接管会话；且 7 个 view 各自复制这份样板，
      # 加固只能逐文件改，漏一个就留一个洞（历史上「一处改不全」正是这套重复结构导致的）。
      # 修复口径：凭据只走后端下发的 HttpOnly + SameSite=Lax Cookie；写操作叠加自定义头
      # X-Ops-Session；CSP 三层下发（后端中间件 / nginx 模板 / vite dev 插件）。
      # 本卡点把这些口径固化为静态不变量（含「合规 fixture 必须绿」的门禁自证测试）。
      # 本地同口径：node .github/scripts/check-ops-session-hygiene.js
      - name: "Gate 18 - ops-center session hygiene (HttpOnly cookie + CSRF header + CSP)"
        run: |
          node --test .github/scripts/check-ops-session-hygiene.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .github/scripts/check-ops-session-hygiene.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # --- Gate 19: 测试层微任务自旋（缺陷 G / L 级：零容忍，无基线）---
      # 接入日期：2026-09-26
      # 事故背景：本会话连续四颗随机红同属一类病 —— 等待没有边界。其中
      # `identity-auth-window.test.js` 写作 `while (...) await Promise.resolve()`：
      # 微任务让出不走宏任务阶段，vitest 的 testTimeout 打不断它，条件永不满足时就是
      # worker 死循环，只能靠 job 级 30 分钟预算硬杀（表现为"CI 无故卡死"，无堆栈无主机）。
      # 同族另三例已各自修掉（#2423 路由 chunk 就绪判据、#2438 对拍挂钟容差、#2442 文件锁握手）。
      # 本卡点把"自旋必须让出宏任务"固化成静态不变量（含门禁自身的夹具自证 + 真实仓库 0 命中棘轮）。
      # 本地同口径：node .github/scripts/check-test-microtask-spin.js
      - name: "Gate 19 - test microtask spin (bounded, interruptible waits)"
        run: |
          node --test .github/scripts/check-test-microtask-spin.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .github/scripts/check-test-microtask-spin.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # --- Gate 20: 测试层出站守卫的接线棘轮（缺陷 G 的全仓化）---
      # 接入日期：2026-09-30
      # 事故背景：出站守卫原先只装在 apps/desktop 一侧，packages/*（252 个测试文件）与 ops-center
      # 全程裸奔 —— 而本仓 nock/msw/setupServer 实测 0 命中，"测试不出网"没有任何传输层兜底，
      # 漏一处就是一次真出站；真出站挂起时先撞上框架 testTimeout，红里只剩
      # `Test timed out in 10000ms`，既看不到目标主机也看不出该注入什么。
      # 本卡点从 `git ls-files` **枚举测试面**（判据来自仓库自身而非印象），逐面要求引用共享 setup；
      # 接不上的必须带原因进只可缩小的欠账清单。已把守卫收敛为
      # packages/shared-utils/src/network-egress-guard.js 一处实现，desktop 侧改为复用。
      # 本地同口径：node .github/scripts/check-test-egress-guard.js
      - name: "Gate 20 - test egress guard wiring (no real outbound in any suite)"
        run: |
          node --test .github/scripts/check-test-egress-guard.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .github/scripts/check-test-egress-guard.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  unit-tests:
    name: QG Unit Tests
    runs-on: windows-latest
    needs: [changes]
    if: needs.changes.outputs.docs-only != 'true'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史（与 origin/main 计算 merge-base/diff 需要；对齐 doc-gate.yml）

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile
      # electron@43 没有 postinstall：pnpm install 之后 electron 包只有 npm 壳、没有 dist。
      # 不先备好二进制，任何 require('electron') 会走进 node_modules/electron/index.js，
      # 它先打 "Downloading Electron binary..." 再当场下载 ⇒ 下载耗时被记到"当时正在跑的那条用例"头上
      # （#2783 实测：15700ms 撞 vitest testTimeout=10000，而该用例本身只要几毫秒）。
      - name: Ensure Electron binary
        run: node scripts/ensure-electron.js

      # --- Gate 4: 全工作区单元测试（含 Vitest 和 Node 测试）---

      - name: "Set test mode"
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            git fetch origin main --depth=1 --no-tags
            "TEST_MODE=affected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "TEST_MODE=affected (nx affected -t test --base=origin/main)"
          } else {
            "TEST_MODE=full" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "TEST_MODE=full (nx run-many -t test --all)"
          }

      - name: "Restore Nx cache"
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-test-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            nx-${{ runner.os }}-test-

      - name: "Gate 4 - Workspace unit tests"
        shell: pwsh
        run: |
          # 进程树遍历收敛到 scripts/get-test-process-tree.ps1：旧的内联版本只按数字 ParentProcessId
          # 递归，根 pnpm 退出后该 PID 会被回收，实测（run 36519025075 attempt 1）把 csrss.exe /
          # winlogon.exe / fontdrvhost.exe / dwm.exe 认成"残留测试子进程"，随后对它们逐个 taskkill /F。
          # 缺文件必须硬失败——静默跳过等于把这条防护降级成装饰性门禁。
          $treeLib = if ($env:GITHUB_WORKSPACE) { Join-Path $env:GITHUB_WORKSPACE 'scripts/get-test-process-tree.ps1' }
            else { Join-Path (Get-Location) 'scripts/get-test-process-tree.ps1' }
          if (-not (Test-Path -LiteralPath $treeLib)) { throw "缺少进程树防护脚本: $treeLib" }
          . $treeLib

          if ($env:TEST_MODE -eq "affected") {
            # 探测受影响项目（排除 desktop）；为空则跳过，避免 nx 空集挂起 30 分钟超时
            # 关键：必须区分「nx 执行失败」与「确实无受影响项目」——失败不能静默跳过，否则测试被假绿关闭
            $affectedRaw = & pnpm exec nx show projects --affected --base=origin/main --exclude=@multi-publish/desktop --json 2>$null
            $nxExit = $LASTEXITCODE
            $affected = $affectedRaw | ConvertFrom-Json -ErrorAction SilentlyContinue
            if ($nxExit -ne 0 -or $null -eq $affected) {
              Write-Host "::warning::nx affected detection failed (exit $nxExit); running tests:affected normally rather than skipping."
            } else {
              $affectedArr = @($affected)
              if ($affectedArr.Count -gt 0) {
                Write-Host "Affected non-desktop projects: $($affectedArr -join ', ')"
              } else {
                Write-Host "No non-desktop projects affected by this PR; skipping workspace unit tests (Gate 4) to avoid nx empty-set hang."
                exit 0
              }
            }
            $testArgs = @("run", "test:affected", "--", "--exclude=@multi-publish/desktop")
          } else {
            $testArgs = @("run", "test:all", "--", "--exclude=@multi-publish/desktop")
          }
          $launchMark = Get-Date
          $testProcess = Start-Process -FilePath "pnpm.cmd" `
            -ArgumentList $testArgs `
            -NoNewWindow -PassThru

          if (-not $testProcess.WaitForExit(1800000)) {
            Write-Host "Gate 4 exceeded its 30-minute execution budget."
            Get-TestProcessTree -RootProcessId $testProcess.Id -NotBefore $launchMark | Format-Table -AutoSize
            taskkill /PID $testProcess.Id /T /F 2>$null | Out-Null
            throw "Gate 4 timed out; terminated the pnpm process tree."
          }

          if ($testProcess.ExitCode -ne 0) {
            Get-TestProcessTree -RootProcessId $testProcess.Id -NotBefore $launchMark | Format-Table -AutoSize
            exit $testProcess.ExitCode
          }

          $remainingTestProcesses = @(Get-TestProcessTree -RootProcessId $testProcess.Id -NotBefore $launchMark)
          if ($remainingTestProcesses.Count -gt 0) {
            Write-Host "Gate 4 completed but left test child processes alive."
            $remainingTestProcesses | Format-Table -AutoSize
            foreach ($process in $remainingTestProcesses) {
              taskkill /PID $process.ProcessId /T /F 2>$null | Out-Null
            }
            throw "Gate 4 left child processes alive after pnpm exited."
          }

      # --- Gate 4b: Startup and require smoke tests ---
      - name: "Gate 4b - Startup and require smoke tests"
        run: pnpm --filter @multi-publish/desktop test:startup

  desktop-shards:
    name: QG Desktop Shards
    runs-on: windows-latest
    needs: [changes]
    if: needs.changes.outputs.docs-only != 'true'
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史（与 origin/main 计算 merge-base/diff 需要；对齐 doc-gate.yml）

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile
      # electron@43 没有 postinstall：pnpm install 之后 electron 包只有 npm 壳、没有 dist。
      # 不先备好二进制，任何 require('electron') 会走进 node_modules/electron/index.js，
      # 它先打 "Downloading Electron binary..." 再当场下载 ⇒ 下载耗时被记到"当时正在跑的那条用例"头上
      # （#2783 实测：15700ms 撞 vitest testTimeout=10000，而该用例本身只要几毫秒）。
      - name: Ensure Electron binary
        run: node scripts/ensure-electron.js


      # --- 桌面 vitest 分片（跨 runner 并行；进程内保持串行确定性契约）---
      # 环境契约：本 job 有意不继承 electron-ci.yml 的 NODE_ENV=test + SKIP_NATIVE_MEDIA_TOOL_TESTS=1，
      # 桌面套件里依赖真实 ffmpeg/ffprobe 的 suite 因此会真跑原生工具（保留这条真实路径覆盖）。
      # 代价是这类 suite 的 beforeAll 必须自带显式 hook 预算，不能指望全局 --hookTimeout=10000；
      # 现有实例见 story2video-stages.test.js 的媒体 beforeAll（MEDIA_SETUP_HOOK_TIMEOUT_MS）。
      - name: "Desktop tests shard ${{ matrix.shard }}"
        shell: pwsh
        run: |
          # 进程树遍历收敛到 scripts/get-test-process-tree.ps1：旧的内联版本只按数字 ParentProcessId
          # 递归，根 pnpm 退出后该 PID 会被回收，实测（run 36519025075 attempt 1）把 csrss.exe /
          # winlogon.exe / fontdrvhost.exe / dwm.exe 认成"残留测试子进程"，随后对它们逐个 taskkill /F。
          # 缺文件必须硬失败——静默跳过等于把这条防护降级成装饰性门禁。
          $treeLib = if ($env:GITHUB_WORKSPACE) { Join-Path $env:GITHUB_WORKSPACE 'scripts/get-test-process-tree.ps1' }
            else { Join-Path (Get-Location) 'scripts/get-test-process-tree.ps1' }
          if (-not (Test-Path -LiteralPath $treeLib)) { throw "缺少进程树防护脚本: $treeLib" }
          . $treeLib

          $launchMark = Get-Date
          $testProcess = Start-Process -FilePath "pnpm.cmd" `
            -ArgumentList @(
              "--filter",
              "@multi-publish/desktop",
              "test",
              "--",
              "--shard=${{ matrix.shard }}",
              "--maxWorkers=1",
              "--no-file-parallelism",
              "--reporter=verbose",
              "--testTimeout=10000",
              "--hookTimeout=10000",
              "--teardownTimeout=10000"
            ) `
            -NoNewWindow -PassThru

          if (-not $testProcess.WaitForExit(1800000)) {
            Write-Host "Desktop shard exceeded its 30-minute execution budget."
            Get-TestProcessTree -RootProcessId $testProcess.Id -NotBefore $launchMark | Format-Table -AutoSize
            taskkill /PID $testProcess.Id /T /F 2>$null | Out-Null
            throw "Desktop shard timed out; terminated the pnpm process tree."
          }

          if ($testProcess.ExitCode -ne 0) {
            Get-TestProcessTree -RootProcessId $testProcess.Id -NotBefore $launchMark | Format-Table -AutoSize
            exit $testProcess.ExitCode
          }

          $remainingTestProcesses = @(Get-TestProcessTree -RootProcessId $testProcess.Id -NotBefore $launchMark)
          if ($remainingTestProcesses.Count -gt 0) {
            Write-Host "Desktop shard completed but left test child processes alive."
            $remainingTestProcesses | Format-Table -AutoSize
            foreach ($process in $remainingTestProcesses) {
              taskkill /PID $process.ProcessId /T /F 2>$null | Out-Null
            }
            throw "Desktop shard left child processes alive after pnpm exited."
          }


