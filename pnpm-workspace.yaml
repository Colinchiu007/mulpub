packages:
  - apps/*
  - packages/*
nodeLinker: hoisted
# pnpm 10+ 默认拒绝构建脚本；npm 基线会执行这些包的 install/postinstall，
# 迁移须保持行为一致（electron@43 无 postinstall，无需放行）
allowBuilds:
  esbuild: true
  vue-demi: true
  ffmpeg-ffprobe-static: true
  nx: true
  tesseract.js: true
  # ⛔ better-sqlite3 显式拒绝构建（false 是 pnpm 语义里的"显式拒绝"；**删掉该行反而更糟**：
  #   pnpm 对"有 binding.gyp 且无 install 脚本"的包会自动注入 `node-gyp rebuild`）。
  #   它是 PR-2 §7.1 引入的 @askjo/camofox-browser@1.18.1 的传递依赖：全仓无任何 require，
  #   且该包自带 prebuilds/（含 win32-x64.node），真实加载路径是 prebuilds 而非 build/Release。
  #   放行的后果（2026-10-16 CI 实测）：每次 install 都要本机 VS C++ 工具链 —— runner 的
  #   node-gyp@9.4.1 认不出 VS 18（unknown version "undefined" found at
  #   "C:\\Program Files\\Microsoft Visual Studio\\18\\Enterprise"）⇒ install rc=1，
  #   13 个下游作业连红。拒绝后 install rc=0，且 require('better-sqlite3') 仍成功（走 prebuilds）
  #   —— 隔离探针 A/B 实证与取证见 openspec/records/oss-b1-pr2.md，回归锁见
  #   apps/desktop/scripts/fetch-camofox.test.js。若将来 sidecar 真要依赖该 npm 包的 JS，
  #   先复核本条（那时才需要确认 prebuild 是否覆盖目标 ABI）。
  better-sqlite3: false
# ⛔ @askjo/camofox-browser **刻意不放进 allowBuilds**（PR-2 §7.1，2026-10-16）：
#   它的 postinstall 会拉 ~500MB 的 camoufox 浏览器本体，且 ① 不做任何 sha256 校验
#   （checkAsset 只匹配资源名前缀）② 失败走 process.exit(0) —— 下载失败安装照样"成功"。
#   放进来的后果：所有人每次 pnpm install 都拉 500MB，且可能拿到"装好了但没浏览器"的假成功。
#   需要构件时显式跑 `pnpm run fetch:camofox`（自带 sidecar-lock.json 的官方 sha256 校验）。
#   若你认为需要改这条，先读 01-docs/PRD-OSS-RPA-HARDENING-2026-10-14.md §3.4 与
#   apps/desktop/sidecar-lock.json 的 _trustModel 段。
# 安全修复版下限：GHSA-3wwx-pv8p-q78v 等 10 条 (undici) / GHSA-qw65-cvwx-89v3 (fast-uri)
# 三条覆写一律带 ^（有上界），由 packages/api-publish-engine/test/production-dependency-security.test.js
# 的「override 必须全部有上界」棘轮守着 —— 加一条新的无上界覆写会当场红，不再靠读注释自觉。
# pnpm 11 起 overrides 只从本文件读取；package.json 的 pnpm 字段会被忽略并告警。
overrides:
  undici: '^7.29.1'
  fast-uri: '^3.1.7'
  # ip-address：7 条新公告（GHSA-22jq-vg5j-6vgg / 2vr4-cq9g-pvrc / 4xrf-jv44-h6hh /
  #   h3mg-xc3c-68pw / j6r3-76f7-8jcv / mwp4-54f8-5fhr(high) / rpw4-54j3-4h4q），
  #   全部要求 >=10.2.1 ~ >=10.7.1 ⇒ 取 latest 10.7.4 一次覆盖。
  #   ⚠️ 这是**既有**传递依赖（express-rate-limit → ip-address@10.2.0，origin/main 的
  #   lock 里就是 10.2.0），不是本 PR 引入；是公告在 2026-10-16 前后新发布才触发阻断。
  #   必须用 overrides 而非升 express-rate-limit——后者由 ops-center 依赖，升级面更大。
  'ip-address': '^10.7.4'
# GHSA-3pq3/542g/9fr6/c29m/mghh/vh66/x97p 等 12 条 axios 公告的修复版本是 >=1.20.0（2026-10-01 实测）。
# 必须用 overrides 而不是只升三个 workspace 包的区间：dev 域 nx@20.8.4 自带一份 axios（实测 1.18.1），
# 而门禁扫描面是 `pnpm audit --prod` —— 只升 prod 会让门禁变绿、锁里那份低危副本一条没少。
# 本文件的覆写面只到 pnpm workspace（packages: apps/* 与 packages/*）。ops-center/frontend 不在
# workspace 内、用自己的 package-lock.json（npm 管理），同批升到 ^1.20.0；四个直接消费方由
# packages/api-publish-engine/test/production-dependency-security.test.js 一起判，不靠注释自觉。
# 刻意写 ^1.20.0 而不是 >=1.20.0：override 整体替换依赖区间，无上界的写法允许下一次非
# --frozen-lockfile 的 install 把 axios 静默 resolve 到 2.x。undici / fast-uri 两条原也是 >=，
# 2026-10-05 实测已一并收成 ^：registry 的 undici dist-tags.latest=8.11.2、fast-uri latest=4.2.1，
# 而锁里解析到的是 undici@7.30.0 / fast-uri@3.1.8 ⇒ 保留 >= 就等于允许下一次非 frozen 的
# install 把它们静默抬到 8.x / 4.x（major 跳变）。两者都是**传递依赖**（undici 由
# @electron/get@5.0.0 / cheerio@1.2.0 / jsdom@29.1.1 声明；fast-uri 由 ajv@8.18.0 / ajv@8.20.0 声明，
# workspace 内无人直接声明），^ 后解析结果不变，改的只是"将来允许解析到什么"。
# nx 声明 axios ^1.8.3、wait-on 声明 ^1.12.1，^1.20.0 落在两者区间内，不属强行覆写。
  axios: '^1.20.0'
# electron 4 条 high 公告的修复下限是 >=43.5.0（GHSA-9qh4-3jw8-366w / GHSA-gr2m-v5gq-v685 /
# GHSA-j84w-jfhq-vhvj 三条 >=43.4.1，GHSA-qmv3-fv6v-rmhq >=43.5.0），锁里此前停在 43.1.1。
# 必须走 overrides 而不是只把 apps/desktop 与根的 devDependency 抬上去：packages/rpa-engine 声明
# `peerDependencies: { electron: '>=33.0.0' }`、packages/shared-utils 声明 `>=20.0.0`（均为
# peerDependenciesMeta.optional），两个可选 peer 的区间**本来就包含** 43.7.7，pnpm 因此沿用旧解
# 43.1.1 不动 —— 只升根与 desktop 的 devDependency，这两条 optional peer 仍各自解析到 43.1.1，
# 而门禁扫描面 `pnpm audit --prod` 命中的正是 `packages__rpa-engine>electron` / `packages__shared-utils>electron`
# 这两条路径 ⇒ 门禁不会变绿，正是本文件既有的 axios 那段注释写的同一个陷阱。
# 刻意不把两个包的 peer 区间收成 >=43.7.7：那是它们对外的兼容契约（收窄等于宣布放弃更老的 electron 消费方），
# override 只改本仓解析结果，不改对外声明。带 ^ 与同段三条一致（有上界，见下方整表棘轮），
# 43.x 内不再跨 major；43-x-y 线的最新是 43.7.7（44.x 已发布但属 major 抬升，另议）。
  electron: '^43.7.7'
