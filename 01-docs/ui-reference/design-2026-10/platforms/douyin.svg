<!-- 平台品牌图标 · 24×24 · 抖音故障三色
     手工绘制的示意标，非官方矢量：Simple Icons v16 与 Iconify 全部 238 个集合（含 IconPark、
     thesvg、arcticons）均无抖音图标，实测 slug douyin/toutiao 一律 not_found。
     造型取八分音符骨架（符头 + 符干 + 右上折角符尾），并按抖音品牌特征叠青/红重影：
     纯单色音符与 TikTok 的音符在同排卡片里区分度不足（两者都会读作"音乐"），
     青 #25F4EE 偏左下、红 #FE2C55 偏右上、黑主体居中，是抖音标的本质识别元素。
     色值沿用本仓既有资产中的抖音双色。 -->
