<!-- 平台品牌图标 · 单色 24×24 · 品牌色 #3855D5
     手工绘制的示意标，非官方矢量：开源图标集合无百家号图标
     （baijiahao/baijia 在 simple-icons、icon-park、thesvg、arcticons 实测全部 not_found）。
